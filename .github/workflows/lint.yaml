name: Lint
on:
  pull_request:
    paths-ignore:
      - "*.md"
      - "assets/**"
jobs:
  lint:
    runs-on: container-registry
    env:
      # Keep the cache inside the workspace so it is writable.
      # /home/runner/.cache is not writable on the container-registry runner.
      GOLANGCI_LINT_CACHE: ${{ github.workspace }}/.cache/golangci-lint
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.5"
          cache: false

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        with:
          version: v2.12.2
          install-only: true

      - name: Run golangci-lint
        # Call golangci-lint directly because the container-registry runner has no
        # working Docker daemon (DOCKER_HOST points at an unreachable DinD
        # sidecar), so task lint-report (which uses docker run) would fail.
        # The golangci-lint binary is provided by the install step above.
        run: |
          golangci-lint run -v \
            --output.tab.path=golangci-lint.report \
            --issues-exit-code 0

      - name: Generate lint summary
        run: |
          echo "<h2> Lint results</h2>" >> $GITHUB_STEP_SUMMARY
          cat golangci-lint.report >> $GITHUB_STEP_SUMMARY
          if [ -s golangci-lint.report ]; then
              echo "Linting issues found!" >> $GITHUB_STEP_SUMMARY
              exit 1
          fi
