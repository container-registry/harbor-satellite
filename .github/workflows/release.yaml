name: Main and Release Pipeline

on:
  push:
    branches: [main]
    tags:
      # Tag push protection (restricting who may create v*.*.* tags) must be
      # enforced via GitHub repository tag-protection rules or rulesets, not
      # here. Ensure only release administrators have permission to push these
      # tags in the repository settings.
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  # Cancelling a main-branch run mid-merge can leave satellite:latest and
  # ground-control:latest pointing at different commits, so main publishes
  # queue instead of cancelling. Tag publishes are not cancelled either.
  group: ${{ github.ref == 'refs/heads/main' && 'publish-main' || format('publish-tag-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  meta:
    name: Resolve publish metadata
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      version: ${{ steps.meta.outputs.version }}
      is_release: ${{ steps.meta.outputs.is_release }}
      registry: ${{ steps.meta.outputs.registry }}
      project: ${{ steps.meta.outputs.project }}
    steps:
      - name: Compute image tag and registry
        id: meta
        env:
          REGISTRY_ADDRESS: ${{ vars.REGISTRY_ADDRESS }}
          PROJECT_NAME: ${{ vars.PROJECT_NAME || github.repository }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            {
              echo "image_tag=${GITHUB_REF_NAME#v}"
              echo "version=${GITHUB_REF_NAME}"
              echo "is_release=true"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "image_tag=latest"
              echo "version=dev"
              echo "is_release=false"
            } >> "$GITHUB_OUTPUT"
          fi

          echo "registry=${REGISTRY_ADDRESS}" >> "$GITHUB_OUTPUT"
          echo "project=${PROJECT_NAME}" >> "$GITHUB_OUTPUT"

          if [ -z "${REGISTRY_ADDRESS}" ]; then
            echo "REGISTRY_ADDRESS repository variable is required" >&2
            exit 2
          fi

          if [ "${REGISTRY_ADDRESS}" = "ghcr.io" ] && [[ "${PROJECT_NAME}" != */* ]]; then
            echo "For ghcr.io, PROJECT_NAME must include the owner, for example: ${GITHUB_REPOSITORY}" >&2
            exit 2
          fi

  build:
    name: linux/${{ matrix.arch }}
    needs: [meta]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64, ppc64le, s390x, riscv64]
    env:
      REGISTRY: ${{ needs.meta.outputs.registry }}
      PROJECT_NAME: ${{ needs.meta.outputs.project }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.5"
          cache: false

      - name: Install Task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          version: 3.x
          repo-token: ${{ github.token }}

      - name: Cross-compile binaries
        env:
          RELEASE_VERSION: ${{ needs.meta.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          task _build:cross-compile \
            COMPONENT=satellite \
            GOARCH="$RELEASE_ARCH" \
            VERSION="$RELEASE_VERSION" \
            GIT_COMMIT="$RELEASE_COMMIT" \
            OUTPUT=bin/linux-"$RELEASE_ARCH"/satellite
          task _build:cross-compile \
            COMPONENT=groundcontrol/server \
            GOARCH="$RELEASE_ARCH" \
            VERSION="$RELEASE_VERSION" \
            GIT_COMMIT="$RELEASE_COMMIT" \
            OUTPUT=bin/linux-"$RELEASE_ARCH"/ground-control

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push satellite by digest
        id: build-satellite
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            BUILDER_MODE=prebuilt
            BINARY_NAME=satellite
          tags: ${{ env.REGISTRY }}/${{ env.PROJECT_NAME }}/satellite
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          provenance: false
          sbom: false

      - name: Build and push ground-control by digest
        id: build-ground-control
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            BUILDER_MODE=prebuilt
            BINARY_NAME=ground-control
          tags: ${{ env.REGISTRY }}/${{ env.PROJECT_NAME }}/ground-control
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          provenance: false
          sbom: false

      - name: Export digests
        env:
          SATELLITE_DIGEST: ${{ steps.build-satellite.outputs.digest }}
          GC_DIGEST: ${{ steps.build-ground-control.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/digests/satellite" "${{ runner.temp }}/digests/ground-control"
          touch "${{ runner.temp }}/digests/satellite/${SATELLITE_DIGEST#sha256:}"
          touch "${{ runner.temp }}/digests/ground-control/${GC_DIGEST#sha256:}"

      - name: Upload digests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge manifests
    needs: [meta, build]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    env:
      REGISTRY: ${{ needs.meta.outputs.registry }}
      PROJECT_NAME: ${{ needs.meta.outputs.project }}
      IMAGE_TAG: ${{ needs.meta.outputs.image_tag }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Log in to registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Create multi-arch manifests
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          for component in satellite ground-control; do
            image="${REGISTRY}/${PROJECT_NAME}/${component}"
            if [ ! -d "${component}" ]; then
              echo "Missing digest directory for ${component}" >&2
              exit 1
            fi
            mapfile -t digest_files < <(find "${component}" -type f -printf '%f\n' | sort)
            if [ "${#digest_files[@]}" -eq 0 ]; then
              echo "No digests found for ${component}" >&2
              exit 1
            fi
            sources=()
            for digest in "${digest_files[@]}"; do
              sources+=("${image}@sha256:${digest}")
            done
            echo "Creating ${image}:${IMAGE_TAG} from ${sources[*]}"
            docker buildx imagetools create -t "${image}:${IMAGE_TAG}" "${sources[@]}"
          done

  sign:
    name: Sign images
    needs: [meta, merge]
    permissions:
      contents: read
      id-token: write
      packages: write
    runs-on: ubuntu-latest
    env:
      REGISTRY: ${{ needs.meta.outputs.registry }}
      PROJECT_NAME: ${{ needs.meta.outputs.project }}
      IMAGE_TAG: ${{ needs.meta.outputs.image_tag }}
    steps:
      - name: Install envsubst
        run: command -v envsubst || (sudo apt-get update && sudo apt-get install -y gettext-base)

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Sign images
        run: |
          set -euo pipefail
          for component in satellite ground-control; do
            image="${REGISTRY}/${PROJECT_NAME}/${component}:${IMAGE_TAG}"
            echo "Signing ${image}"
            cosign sign --yes --recursive "${image}"
          done

  publish-release:
    name: Create Release
    needs: [meta, sign]
    if: needs.meta.outputs.is_release == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.5"
          cache: false

      - name: Install Task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          version: 3.x
          repo-token: ${{ github.token }}

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          install-only: true

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: task release
