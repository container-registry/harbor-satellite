services:
  postgres:
    image: postgres:16
    container_name: groundcontrol-db
    environment:
      POSTGRES_DB: groundcontrol
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "8100:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d groundcontrol"]
      interval: 5s
      timeout: 5s
      retries: 5

  ground-control:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        COMPONENT: groundcontrol/server
    container_name: ground-control
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: groundcontrol
      DB_USERNAME: postgres
      DB_PASSWORD: password
      HARBOR_USERNAME: ${HARBOR_USERNAME}
      HARBOR_PASSWORD: ${HARBOR_PASSWORD}
      HARBOR_URL: ${HARBOR_URL}
      PORT: 8080
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Harbor12345}
      SKIP_HARBOR_HEALTH_CHECK: "true"
      SPIFFE_SERVER_ENABLED: "false"
      SPIFFE_TRUST_DOMAIN: harbor-satellite.local
      SPIFFE_PROVIDER: sidecar
      SPIFFE_ENDPOINT_SOCKET: unix:///run/spire/sockets/agent.sock
    ports:
      - "${GC_PORT:-7080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  satellite:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        COMPONENT: satellite
    container_name: satellite
    environment:
      - GROUND_CONTROL_URL=http://ground-control:8080
      - HARBOR_REGISTRY_URL=${HARBOR_REGISTRY_URL:-https://demo.goharbor.io}
      - TOKEN=${TOKEN:-changeme}
      - CONFIG_DIR=/data
    volumes:
      - satellite-data:/data
    ports:
      - "${SATELLITE_PORT:-9090}:9090"
    depends_on:
      - ground-control
    restart: always

volumes:
  pgdata:
  satellite-data:
