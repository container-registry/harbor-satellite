# Base Docker Compose for Harbor Satellite Quickstart
# This file is used by all authentication method deployments

services:
  # PostgreSQL for Ground Control
  postgres:
    image: postgres:15-alpine
    container_name: harbor-satellite-postgres
    environment:
      POSTGRES_USER: harbor
      POSTGRES_PASSWORD: harbor
      POSTGRES_DB: harbor_satellite
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harbor -d harbor_satellite"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - harbor-satellite

  # Mock Harbor uses the Docker Official Distribution registry image with
  # filesystem storage and its HTTP listener configured explicitly below.
  mock-harbor:
    image: registry:2
    container_name: mock-harbor
    environment:
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
      REGISTRY_HTTP_ADDR: 0.0.0.0:5000
    volumes:
      - mock-harbor-data:/var/lib/registry
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:5000/v2/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - harbor-satellite

volumes:
  postgres-data:
  mock-harbor-data:

networks:
  harbor-satellite:
    name: harbor-satellite
