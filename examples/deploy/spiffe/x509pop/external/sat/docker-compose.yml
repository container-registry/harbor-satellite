# Docker Compose for Satellite with External SPIRE Agent (X.509 PoP Attestation)
# Requires the GC-side SPIRE server to be running (from ../groundcontrol/)

services:
  spire-agent-satellite:
    image: ghcr.io/spiffe/spire-agent:1.12.3
    container_name: spire-agent-satellite
    hostname: spire-agent-satellite
    pid: host
    command: ["-config", "/opt/spire/conf/agent/agent.conf"]
    volumes:
      - ./spire/agent-satellite.conf:/opt/spire/conf/agent/agent.conf:ro
      - ../groundcontrol/certs/ca.crt:/opt/spire/conf/agent/bootstrap.crt:ro
      - ../groundcontrol/certs/agent-satellite.crt:/opt/spire/conf/agent/agent.crt:ro
      - ../groundcontrol/certs/agent-satellite.key:/opt/spire/conf/agent/agent.key:ro
      - spire-agent-satellite-data:/opt/spire/data/agent
      - spire-agent-satellite-socket:/run/spire/sockets
      # Required for SPIRE workload attestor (identifies containers by Docker labels)
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-agent", "healthcheck", "-socketPath", "/run/spire/sockets/agent.sock"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - harbor-satellite

  satellite:
    build:
      context: ../../../../../..
      dockerfile: Dockerfile
    container_name: satellite
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - GROUND_CONTROL_URL=https://ground-control:8080
      - HARBOR_REGISTRY_URL=${HARBOR_REGISTRY_URL:-http://host.docker.internal:8080}
      - USE_UNSECURE=true
      - SPIFFE_ENABLED=true
      - SPIFFE_ENDPOINT_SOCKET=unix:///run/spire/sockets/agent.sock
      - SPIFFE_EXPECTED_SERVER_ID=spiffe://harbor-satellite.local/ground-control
      - CONFIG_DIR=/data
    volumes:
      - spire-agent-satellite-socket:/run/spire/sockets:ro
      - satellite-data:/data
    depends_on:
      spire-agent-satellite:
        condition: service_healthy
    networks:
      - harbor-satellite

volumes:
  spire-agent-satellite-data:
  spire-agent-satellite-socket:
  satellite-data:

networks:
  harbor-satellite:
    external: true
