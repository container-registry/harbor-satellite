# Start the satellite after the local SPIRE agent when SPIFFE auth is used.
# Install to /etc/systemd/system/harbor-satellite.service.d/ and run
# "systemctl daemon-reload".
#
# Requires= stops the satellite if the agent fails to start. Change it to
# Wants= if the satellite should start anyway, or to BindsTo= if it should
# also stop whenever the agent stops.

[Unit]
After=spire-agent.service
Requires=spire-agent.service
