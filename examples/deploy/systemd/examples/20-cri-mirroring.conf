# Lets the satellite rewrite container runtime configs so pulls go through
# its local proxy (127.0.0.1:8585) with the upstream registry as fallback.
# Needed when you pass --mirrors (see 30-mirrors-*.conf) or when Ground
# Control enables registry_fallback in the satellite config.
#
# Install to /etc/systemd/system/harbor-satellite.service.d/ and run
# "systemctl daemon-reload".
#
# This runs the satellite as root. The runtime configs under /etc are owned
# by root, and Docker has to be restarted with "systemctl restart docker"
# after daemon.json changes. The rest of the sandbox stays in place.

[Service]
User=root
Group=root
PrivateUsers=false
CapabilityBoundingSet=CAP_DAC_OVERRIDE CAP_CHOWN CAP_FOWNER
# The "-" prefix skips paths that do not exist on this host.
ReadWritePaths=-/etc/docker -/etc/containerd -/etc/containers
