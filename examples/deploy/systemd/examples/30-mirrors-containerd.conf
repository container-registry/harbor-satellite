# Point containerd at the satellite proxy for the listed registries.
# containerd gets a hosts.toml per registry under /etc/containerd/certs.d.
#
# Install together with 20-cri-mirroring.conf in
# /etc/systemd/system/harbor-satellite.service.d/ and run
# "systemctl daemon-reload". Edit the registry list as needed.

[Service]
ExecStart=
ExecStart=/opt/harbor-satellite/satellite --mirrors=containerd:docker.io,quay.io
