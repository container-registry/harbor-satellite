# Point Docker at the satellite proxy for docker.io, the only registry
# Docker can mirror. The satellite updates /etc/docker/daemon.json and
# restarts Docker.
#
# Install together with 20-cri-mirroring.conf in
# /etc/systemd/system/harbor-satellite.service.d/ and run
# "systemctl daemon-reload".

[Service]
ExecStart=
ExecStart=/opt/harbor-satellite/satellite --mirrors=docker:true
