# Point Podman at the satellite proxy for the listed registries through
# /etc/containers/registries.conf. For CRI-O use --mirrors=crio:<registries>.
#
# Install together with 20-cri-mirroring.conf in
# /etc/systemd/system/harbor-satellite.service.d/ and run
# "systemctl daemon-reload". Edit the registry list as needed.

[Service]
ExecStart=
ExecStart=/opt/harbor-satellite/satellite --mirrors=podman:docker.io
