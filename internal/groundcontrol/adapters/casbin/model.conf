[request_definition]
r = subs, objs, typ, act

[policy_definition]
p = sub, scope, typ, act, eft

[role_definition]
g = _, _

[policy_effect]
e = some(where (p.eft == allow)) && !some(where (p.eft == deny))

[matchers]
m = anyLinked(r.subs, p.sub) && (p.scope == "*" || listHas(r.objs, p.scope)) && (p.typ == "*" || r.typ == p.typ) && (p.act == "*" || r.act == p.act)
