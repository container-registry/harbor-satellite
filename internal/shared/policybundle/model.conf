[request_definition]
r = sub, repo, ref, act

[policy_definition]
p = sub, repo, ref, act, eft

[policy_effect]
e = some(where (p.eft == allow)) && !some(where (p.eft == deny))

[matchers]
m = (p.sub == "*" || r.sub == p.sub) && keyMatch(r.repo, p.repo) && (p.ref == "*" || (r.ref == "*" && p.eft == "allow") || (r.ref != "*" && globMatch(r.ref, p.ref))) && (p.act == "*" || r.act == p.act)
