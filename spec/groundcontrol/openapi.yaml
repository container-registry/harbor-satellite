openapi: 3.0.0
info:
  description: |
    Ground Control manages Harbor Satellite registration, configuration,
    group membership, user administration, status reporting, and SPIRE/SPIFFE
    bootstrap flows. JSON schemas describe the public transport contract and
    are intentionally independent of the Ground Control database schema.
  title: Ground Control
  version: 0.1.0
paths:
  /api/configs:
    get:
      tags:
        - configs
      summary: Lists satellite configurations.
      operationId: listConfigs
      responses:
        "200":
          description: Configurations returned.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConfigResponse"
        "401":
          description: Authorization token is missing or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "500":
          description: Configurations could not be listed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
      security:
        - tokenAuth: []
    post:
      tags:
        - configs
      summary: Creates a satellite configuration.
      operationId: createConfig
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigCreateRequest"
        description: Configuration creation payload.
        required: true
      responses:
        "201":
          description: >
            Configuration created. From plan item 7.4 the body is the stored
            configuration with its validation warnings; today it is empty.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigResponse"
        "400":
          description: Configuration payload or name is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "401":
          description: Authorization token is missing or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "409":
          description: Configuration already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "422":
          description: >
            The configuration fails validation (plan item 7.4, not checked
            yet); nothing is stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigValidationError"
        "500":
          description: Configuration could not be created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
      security:
        - tokenAuth: []
  /api/configs/satellite:
    post:
      tags:
        - configs
      summary: Sets the configuration assigned to a satellite.
      operationId: setSatelliteConfig
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SatelliteConfigRequest"
        description: Satellite configuration assignment payload.
        required: true
      responses:
        "200":
          description: Satellite configuration assignment updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyResponse"
        "400":
          description: Assignment payload, satellite, or configuration is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "401":
          description: Authorization token is missing or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "500":
          description: Satellite configuration assignment could not be updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
      security:
        - tokenAuth: []
  "/api/configs/{config}":
    get:
      tags:
        - configs
      summary: Gets a satellite configuration.
      operationId: getConfig
      parameters:
        - x-go-name: Config
          description: Configuration name.
          name: config
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Configuration returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigResponse"
        "401":
          description: Authorization token is missing or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "404":
          description: Configuration was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "500":
          description: Configuration could not be loaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
      security:
        - tokenAuth: []
    delete:
      tags:
        - configs
      summary: Deletes an unused satellite configuration.
      operationId: deleteConfig
      parameters:
        - x-go-name: Config
          description: Configuration name.
          name: config
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Configuration deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyResponse"
        "400":
          description: Configuration is in use and cannot be deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "401":
          description: Authorization token is missing or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "500":
          description: Configuration could not be deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
      security:
        - tokenAuth: []
    patch:
      tags:
        - configs
      summary: Applies a merge patch to a satellite configuration.
      operationId: updateConfig
      parameters:
        - x-go-name: Config
          description: Configuration name.
          name: config
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigMergePatch"
        description: Configuration merge patch payload.
        required: true
      responses:
        "200":
          description: Configuration updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigResponse"
        "400":
          description: Configuration name, body, or merge patch is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "401":
          description: Authorization token is missing or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "404":
          description: Configuration was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "409":
          description: The configuration changed concurrently; retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "422":
          description: >
            The configuration fails validation (plan item 7.4, not checked
            yet); nothing is stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigValidationError"
        "500":
          description: Configuration could not be updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
      security:
        - tokenAuth: []
  /api/groups:
    get:
      tags:
        - groups
      summary: Lists groups.
      operationId: listGroups
      responses:
        "200":
          description: Groups returned.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupResponse"
        "401":
          description: Authorization token is missing or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "500":
          description: Groups could not be listed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
      security:
        - tokenAuth: []
  /api/groups/satellite:
    post:
      tags:
        - groups
      summary: Adds a satellite to a group.
      operationId: addSatelliteToGroup
      requestBody:
        $ref: "#/components/requestBodies/SatelliteGroupRequest"
      responses:
        "200":
          description: Satellite was added to the group or was already a member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Satellite or group is invalid or not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "401":
          description: Authorization token is missing or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "500":
          description: Satellite could not be added to the group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
      security:
        - tokenAuth: []
    delete:
      tags:
        - groups
      summary: Removes a satellite from a group.
      operationId: removeSatelliteFromGroup
      requestBody:
        $ref: "#/components/requestBodies/SatelliteGroupRequest"
      responses:
        "200":
          description: Satellite removed from the group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyResponse"
        "400":
          description: Satellite or group is invalid or not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "401":
          description: Authorization token is missing or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "500":
          description: Satellite could not be removed from the group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
      security:
        - tokenAuth: []
  /api/groups/sync:
    post:
      tags:
        - groups
      summary: Synchronizes a group state artifact.
      operationId: syncGroup
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupSyncRequest"
        description: Group state artifact payload.
        required: true
      responses:
        "200":
          description: Group synchronized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupResponse"
        "400":
          description: Group state artifact payload is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "401":
          description: Authorization token is missing or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "500":
          description: Group could not be synchronized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "502":
          description: Harbor project lookup, creation, or group state artifact push failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
      security:
        - tokenAuth: []
  "/api/groups/{group}":
    get:
      tags:
        - groups
      summary: Gets a group by name.
      operationId: getGroup
      parameters:
        - x-go-name: Group
          description: Group name.
          name: group
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Group returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupResponse"
        "401":
          description: Authorization token is missing or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "404":
          description: Group was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "500":
          description: Group could not be loaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
      security:
        - tokenAuth: []
    delete:
      tags:
        - groups
      summary: Deletes a group.
      operationId: deleteGroup
      parameters:
        - x-go-name: Group
          description: Group name.
          name: group
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Group deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyResponse"
        "401":
          description: Authorization token is missing or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "403":
          description: System administrator role is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "404":
          description: Group was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "500":
          description: Group could not be deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
      security:
        - tokenAuth: []
  "/api/groups/{group}/satellites":
    get:
      tags:
        - groups
      summary: Lists satellites attached to a group.
      operationId: listGroupSatellites
      parameters:
        - x-go-name: Group
          description: Group name.
          name: group
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Group satellites returned.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupSatelliteResponse"
        "401":
          description: Authorization token is missing or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "404":
          description: Group was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "500":
          description: Group satellites could not be listed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
      security:
        - tokenAuth: []
  /api/logout:
    post:
      tags:
        - auth
      summary: Deletes the current user session.
      operationId: logout
      responses:
        "204":
          description: Session deleted.
        "401":
          description: Authorization token is missing or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "500":
          description: Session could not be deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
      security:
        - tokenAuth: []
  /api/ops/outbox:
    get:
      tags:
        - ops
      summary: Lists outbox events that are not done yet.
      operationId: listOutboxEvents
      parameters:
        - x-go-name: State
          description: "pending lists every event that is not done; failed only those that reached the maximum attempts. Default pending."
          name: state
          in: query
          schema:
            type: string
        - x-go-name: Limit
          description: Maximum number of events returned.
          name: limit
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 1000
      responses:
        "200":
          description: Outbox events returned, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OutboxEventResponse"
        "400":
          description: Unknown state or limit out of range.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "401":
          description: Authorization token is missing or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "403":
          description: System administrator role is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
      security:
        - tokenAuth: []
  /api/policies:
    get:
      tags:
        - policies
      summary: Lists the stored policy rules (plan item 7.3, not implemented yet).
      operationId: listPolicyRules
      responses:
        "200":
          description: Policy rules returned, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PolicyRule"
        "401":
          description: Authorization token is missing or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "403":
          description: System administrator role is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "500":
          description: Policy rules could not be listed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
      security:
        - tokenAuth: []
    post:
      tags:
        - policies
      summary: Stores a policy rule (plan item 7.3, not implemented yet).
      description: >
        Every stored rule bumps the policy version that Ground Control
        replicas poll. A scoped rule (scope other than "*") may only name
        the satellite, group or config type.
      operationId: createPolicyRule
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyRuleRequest"
        description: Policy rule.
        required: true
      responses:
        "201":
          description: Policy rule stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyRule"
        "400":
          description: The rule is malformed or names a type, action or scope it may not.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "401":
          description: Authorization token is missing or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "403":
          description: System administrator role is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "409":
          description: The same rule is already stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "500":
          description: Policy rule could not be stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
      security:
        - tokenAuth: []
  "/api/policies/{id}":
    delete:
      tags:
        - policies
      summary: Deletes a stored policy rule (plan item 7.3, not implemented yet).
      operationId: deletePolicyRule
      parameters:
        - x-go-name: ID
          description: Policy rule ID.
          name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Policy rule deleted.
        "401":
          description: Authorization token is missing or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "403":
          description: System administrator role is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "404":
          description: Policy rule was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "500":
          description: Policy rule could not be deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
      security:
        - tokenAuth: []
  /api/role-bindings:
    get:
      tags:
        - policies
      summary: Lists the stored role bindings (plan item 7.3, not implemented yet).
      operationId: listRoleBindings
      responses:
        "200":
          description: Role bindings returned, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoleBinding"
        "401":
          description: Authorization token is missing or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "403":
          description: System administrator role is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "500":
          description: Role bindings could not be listed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
      security:
        - tokenAuth: []
    post:
      tags:
        - policies
      summary: Gives a principal an additional role (plan item 7.3, not implemented yet).
      description: >
        Built-in roles come from the user's role and cannot be bound here.
      operationId: createRoleBinding
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleBindingRequest"
        description: Role binding.
        required: true
      responses:
        "201":
          description: Role binding stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleBinding"
        "400":
          description: The principal or role is malformed or a built-in role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "401":
          description: Authorization token is missing or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "403":
          description: System administrator role is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "409":
          description: The principal already has the role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "500":
          description: Role binding could not be stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
      security:
        - tokenAuth: []
  "/api/role-bindings/{id}":
    delete:
      tags:
        - policies
      summary: Deletes a stored role binding (plan item 7.3, not implemented yet).
      operationId: deleteRoleBinding
      parameters:
        - x-go-name: ID
          description: Role binding ID.
          name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Role binding deleted.
        "401":
          description: Authorization token is missing or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "403":
          description: System administrator role is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "404":
          description: Role binding was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "500":
          description: Role binding could not be deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
      security:
        - tokenAuth: []
  /api/satellites:
    get:
      tags:
        - satellites
      summary: Lists satellites.
      operationId: listSatellites
      responses:
        "200":
          description: Satellites returned.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SatelliteResponse"
        "401":
          description: Authorization token is missing or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "500":
          description: Satellites could not be listed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
      security:
        - tokenAuth: []
    post:
      tags:
        - satellites
      summary: Registers a token-managed satellite.
      operationId: registerSatellite
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenSatelliteRegistrationRequest"
        description: Satellite registration payload.
        required: true
      responses:
        "200":
          description: Satellite registered with a zero-touch token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenSatelliteRegistrationResponse"
        "400":
          description: Registration payload, name, config, or robot account is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "401":
          description: Authorization token is missing or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "500":
          description: Satellite could not be registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
      security:
        - tokenAuth: []
  /api/satellites/active:
    get:
      tags:
        - satellites
      summary: Lists active satellites.
      operationId: listActiveSatellites
      responses:
        "200":
          description: Active satellites returned.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActiveSatelliteResponse"
        "401":
          description: Authorization token is missing or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "500":
          description: Active satellites could not be listed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
      security:
        - tokenAuth: []
  /api/satellites/register:
    post:
      tags:
        - spire
      summary: Registers a satellite workload identity with SPIFFE.
      operationId: registerSatelliteWithSpiffe
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SPIFFESatelliteRegistrationRequest"
        description: SPIFFE satellite registration payload.
        required: true
      responses:
        "200":
          description: SPIFFE workload identity registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SPIFFESatelliteRegistrationResponse"
