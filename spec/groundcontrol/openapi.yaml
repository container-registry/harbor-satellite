  /ping:
    get:
      tags:
        - health
      summary: Pings the server.
      operationId: ping
      responses:
        "200":
          description: Server is reachable and returns pong.
          content:
            text/plain:
              schema:
                type: string
  /satellites/refresh:
    post:
      tags:
        - satellites
      summary: Rotates the satellite's Harbor robot secret.
      operationId: refreshSatelliteCredentials
      responses:
        "200":
          description: Robot secret rotated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshCredentialsResponse"
        "401":
          description: Satellite credentials are missing, invalid or expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "403":
          description: Satellite or robot account is unknown.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "429":
          description: Too many satellite requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "500":
          description: Robot secret could not be rotated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
  /satellites/spiffe-ztr:
    get:
      tags:
        - satellites
      summary: Performs SPIFFE-based zero-touch registration.
      operationId: spiffeZtr
      responses:
        "200":
          description: SPIFFE zero-touch registration completed and registry credentials
            returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateConfigResponse"
        "400":
          description: SPIFFE ID format or satellite identity is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "401":
          description: SPIFFE authentication is missing or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "429":
          description: Too many SPIFFE zero-touch registration attempts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "500":
          description: SPIFFE zero-touch registration could not be completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "503":
          description: The satellite's registry account is not provisioned yet; retry after the delay.
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
  /satellites/sync:
    post:
      tags:
        - satellites
      summary: Reports satellite status.
      operationId: syncSatellite
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SatelliteStatusRequest"
        description: Satellite status report payload.
        required: true
      responses:
        "200":
          description: Satellite status report accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SatelliteSyncResponse"
        "400":
          description: Status payload or heartbeat interval is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "401":
          description: Satellite credentials are missing or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "403":
          description: Satellite identity is unknown or not authorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "413":
          description: >
            The request body exceeds SYNC_MAX_BODY_BYTES (plan item 6.5, not
            enforced yet).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "429":
          description: Too many status reports.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "500":
          description: Satellite status report could not be saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
  /satellites/ztr:
    post:
      tags:
        - satellites
      summary: Performs token-based zero-touch registration.
      operationId: ztr
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ZTRRequest"
        description: Single-use zero-touch registration request.
        required: true
      responses:
        "200":
          description: Zero-touch registration completed and registry credentials returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateConfigResponse"
        "400":
          description: Registration token is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "401":
          description: Registration token has expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "422":
          description: Registration token payload is malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "429":
          description: Too many zero-touch registration attempts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "500":
          description: Zero-touch registration could not be completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "503":
          description: The satellite's registry account is not provisioned yet; retry after the delay.
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
servers:
  - url: /
components:
  requestBodies:
    SatelliteGroupRequest:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SatelliteGroupRequest"
      description: Satellite and group membership payload.
      required: true
  securitySchemes:
    tokenAuth:
      description: Session token authentication. Swagger UI accepts the raw token;
        HTTP clients may also use Bearer <token>.
      type: apiKey
      name: Authorization
      in: header
  schemas:
    ActiveSatelliteResponse:
      type: object
      title: ActiveSatelliteResponse describes a satellite with a recent heartbeat.
      properties:
        ID:
          type: integer
          format: int32
        Name:
          type: string
        CreatedAt:
          type: string
          format: date-time
        UpdatedAt:
          type: string
          format: date-time
        LastSeen:
          $ref: "#/components/schemas/NullableTimeValue"
        HeartbeatInterval:
          $ref: "#/components/schemas/NullableStringValue"
        LastActivity:
          type: string
        LastStatusTime:
          type: string
          format: date-time
    AppConfig:
      type: object
      title: AppConfig contains Harbor Satellite application settings.
      properties:
        ground_control_url:
          type: string
          x-go-name: GroundControlURL
        log_level:
          type: string
          x-go-name: LogLevel
        use_unsecure:
          type: boolean
          x-go-name: UseUnsecure
        state_replication_interval:
          type: string
          x-go-name: StateReplicationInterval
        register_satellite_interval:
          type: string
          x-go-name: RegisterSatelliteInterval
        heartbeat_interval:
          type: string
          x-go-name: HeartbeatInterval
        metrics:
          $ref: "#/components/schemas/MetricsConfig"
        bring_own_registry:
          type: boolean
          x-go-name: BringOwnRegistry
        local_registry:
          $ref: "#/components/schemas/RegistryCredentials"
        tls:
          $ref: "#/components/schemas/TLSConfig"
        spiffe:
          $ref: "#/components/schemas/SPIFFEClientConfig"
        encrypt_config:
          type: boolean
          x-go-name: EncryptConfig
        registry_fallback:
          $ref: "#/components/schemas/RegistryFallbackConfig"
        harbor_registry_url:
          type: string
          x-go-name: HarborRegistryURL
        direct_delivery:
          $ref: "#/components/schemas/DirectDeliveryConfig"
        audit:
          $ref: "#/components/schemas/AuditConfig"
        peer_distribution:
          $ref: "#/components/schemas/PeerDistributionConfig"
          x-go-name: PeerDistribution
        replication_concurrency:
          type: integer
          minimum: 0
          description: >
            Group states replicated at once; 0 replicates every group at once
            as today (plan item 6.2, not read yet).
          x-go-name: ReplicationConcurrency
        replication_bandwidth_bytes_per_sec:
          type: integer
          format: int64
          minimum: 0
          description: Bandwidth budget of state replication (plan item 6.2, not read yet).
          x-go-name: ReplicationBandwidthBytesPerSec
        journal:
          $ref: "#/components/schemas/JournalConfig"
        admission:
          $ref: "#/components/schemas/AdmissionConfig"
        registry_auth:
          $ref: "#/components/schemas/RegistryAuthConfig"
    RegistryAuthConfig:
      type: object
      title: RegistryAuthConfig selects how the satellite authenticates to Harbor (plan item 8.3, not read yet).
      properties:
        mode:
          type: string
          description: robot (default) or workload_identity.
          x-go-name: Mode
        audience:
          type: string
          description: JWT-SVID audience for workload_identity.
          x-go-name: Audience
    DeviceAuthorizationResponse:
      type: object
      title: DeviceAuthorizationResponse starts an OIDC device flow (RFC 8628).
      required:
        - device_code
        - user_code
        - verification_uri
        - expires_in
        - interval
      properties:
        device_code:
          type: string
