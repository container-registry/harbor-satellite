        user_code:
          type: string
          x-go-name: UserCode
        verification_uri:
          type: string
          x-go-name: VerificationURI
        verification_uri_complete:
          type: string
          x-go-name: VerificationURIComplete
        expires_in:
          type: integer
          format: int64
