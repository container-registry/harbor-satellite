version: "3"

vars:
  GOOS:
    sh: go env GOOS
  GOARCH:
    sh: go env GOARCH

tasks:
  satellite:
    desc: Build satellite binary for current platform
    cmds:
      - echo "Building satellite for {{.GOOS}}/{{.GOARCH}}..."
      - mkdir -p {{.BIN_DIR}}
      - go build -o {{.BIN_DIR}}/satellite ./cmd/satellite
      - echo "Built bin/satellite"
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - "{{.BIN_DIR}}/satellite"
    silent: true

  groundcontrold:
    desc: Build groundcontrold (Ground Control server) binary for current platform
    cmds:
      - echo "Building groundcontrold for {{.GOOS}}/{{.GOARCH}}..."
      - mkdir -p {{.BIN_DIR}}
      - go build -o {{.BIN_DIR}}/groundcontrold ./cmd/groundcontrold
      - echo "Built bin/groundcontrold"
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - "{{.BIN_DIR}}/groundcontrold"
    silent: true

  groundctl:
    desc: Build groundctl (Ground Control client) for current platform
    cmds:
      - echo "Building groundctl for {{.GOOS}}/{{.GOARCH}}..."
      - mkdir -p {{.BIN_DIR}}
      - go build -o {{.BIN_DIR}}/groundctl ./cmd/groundctl
      - echo "Built bin/groundctl"
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - "{{.BIN_DIR}}/groundctl"
    silent: true

  dev:
    desc: Quick dev build for all executables on the current platform
    vars:
      GOOS:
        sh: go env GOOS
      GOARCH:
        sh: go env GOARCH
    cmds:
      - echo "Building satellite, groundcontrold, and groundctl for {{.GOOS}}/{{.GOARCH}}..."
      - mkdir -p {{.BIN_DIR}}
      - echo "  Compiling satellite..."
      - go build -o {{.BIN_DIR}}/satellite ./cmd/satellite
      - echo "  Compiling groundcontrold..."
      - go build -o {{.BIN_DIR}}/groundcontrold ./cmd/groundcontrold
      - echo "  Compiling groundctl..."
      - go build -o {{.BIN_DIR}}/groundctl ./cmd/groundctl
      - echo "Done! Binaries in bin/"
    silent: true

  all:
    desc: Build all executables for all platforms
    cmds:
      - echo "Building all platforms..."
      - task: all-satellite
      - task: all-groundcontrold
      - task: all-groundctl
      - echo "Done! All binaries in bin/"

  all-satellite:
    desc: Build satellite for all platforms
    cmds:
      - echo "Building satellite for all platforms..."
      - mkdir -p {{.BIN_DIR}}/satellite
      - for:
          matrix:
            GOOS: [linux]
            GOARCH: [amd64, arm64, ppc64le, s390x, riscv64]
        cmd: |
          echo "  {{.ITEM.GOOS}}/{{.ITEM.GOARCH}}..."
          GOOS={{.ITEM.GOOS}} GOARCH={{.ITEM.GOARCH}} go build -o {{.BIN_DIR}}/satellite/satellite-{{.ITEM.GOOS}}-{{.ITEM.GOARCH}} ./cmd/satellite
      - for:
          matrix:
            GOOS: [darwin]
            GOARCH: [amd64, arm64]
        cmd: |
          echo "  {{.ITEM.GOOS}}/{{.ITEM.GOARCH}}..."
          GOOS={{.ITEM.GOOS}} GOARCH={{.ITEM.GOARCH}} go build -o {{.BIN_DIR}}/satellite/satellite-{{.ITEM.GOOS}}-{{.ITEM.GOARCH}} ./cmd/satellite
    silent: true

  all-groundcontrold:
    desc: Build groundcontrold for all platforms
    cmds:
      - echo "Building groundcontrold for all platforms..."
      - mkdir -p {{.BIN_DIR}}/groundcontrold
      - for:
          matrix:
            GOOS: [linux]
            GOARCH: [amd64, arm64, ppc64le, s390x, riscv64]
        cmd: |
          echo "  {{.ITEM.GOOS}}/{{.ITEM.GOARCH}}..."
          GOOS={{.ITEM.GOOS}} GOARCH={{.ITEM.GOARCH}} go build -o {{.BIN_DIR}}/groundcontrold/groundcontrold-{{.ITEM.GOOS}}-{{.ITEM.GOARCH}} ./cmd/groundcontrold
      - for:
          matrix:
            GOOS: [darwin]
            GOARCH: [amd64, arm64]
        cmd: |
          echo "  {{.ITEM.GOOS}}/{{.ITEM.GOARCH}}..."
          GOOS={{.ITEM.GOOS}} GOARCH={{.ITEM.GOARCH}} go build -o {{.BIN_DIR}}/groundcontrold/groundcontrold-{{.ITEM.GOOS}}-{{.ITEM.GOARCH}} ./cmd/groundcontrold
    silent: true

  all-groundctl:
    desc: Build groundctl for all platforms
    cmds:
      - echo "Building groundctl for all platforms..."
      - mkdir -p {{.BIN_DIR}}/groundctl
      - for:
          matrix:
            GOOS: [linux]
            GOARCH: [amd64, arm64, ppc64le, s390x, riscv64]
        cmd: |
          echo "  {{.ITEM.GOOS}}/{{.ITEM.GOARCH}}..."
          GOOS={{.ITEM.GOOS}} GOARCH={{.ITEM.GOARCH}} go build -o {{.BIN_DIR}}/groundctl/groundctl-{{.ITEM.GOOS}}-{{.ITEM.GOARCH}} ./cmd/groundctl
      - for:
          matrix:
            GOOS: [darwin]
            GOARCH: [amd64, arm64]
        cmd: |
          echo "  {{.ITEM.GOOS}}/{{.ITEM.GOARCH}}..."
          GOOS={{.ITEM.GOOS}} GOARCH={{.ITEM.GOARCH}} go build -o {{.BIN_DIR}}/groundctl/groundctl-{{.ITEM.GOOS}}-{{.ITEM.GOARCH}} ./cmd/groundctl
    silent: true
