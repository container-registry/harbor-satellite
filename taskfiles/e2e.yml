version: "3"

# HARBOR_EXTERNAL=1 runs the Harbor-backed tests against an already running
# Harbor instead of the bundled one. HARBOR_NETWORK names its docker network,
# HARBOR_HOST_URL is its URL from the host and HARBOR_INTERNAL_URL (default
# http://core:8080) its URL inside that network, which must match its
# EXT_ENDPOINT. The e2e containers, Harbor projects, robots and state
# artifacts then carry the hs-e2e- prefix, and cleanup removes only those.
# E2E_GC_HOST_PORT (default 9180) sets the Ground Control host port.
vars:
  E2E_DIR: "{{.ROOT_DIR}}/test/e2e/docker"
  HARBOR_ADMIN_USER: admin
  HARBOR_ADMIN_PASSWORD: Harbor12345
  HARBOR_EXTERNAL: '{{env "HARBOR_EXTERNAL"}}'
  HARBOR_NETWORK: '{{env "HARBOR_NETWORK"}}'
  E2E_PREFIX: '{{if .HARBOR_EXTERNAL}}hs-e2e-{{end}}'
  HARBOR_URL: '{{if .HARBOR_EXTERNAL}}{{env "HARBOR_HOST_URL"}}{{else}}http://localhost:8080{{end}}'
  HARBOR_INTERNAL_URL: '{{if .HARBOR_EXTERNAL}}{{env "HARBOR_INTERNAL_URL" | default "http://core:8080"}}{{else}}http://core:8080{{end}}'
  HARBOR_INTERNAL_HOST: '{{.HARBOR_INTERNAL_URL | trimPrefix "http://" | trimPrefix "https://"}}'
  HARBOR_API: "{{.HARBOR_URL}}/api/v2.0"
  GROUNDCONTROL_ADMIN_USER: admin
  GROUNDCONTROL_ADMIN_PASSWORD: AdminPass123
  GC_HOST_PORT: '{{if .HARBOR_EXTERNAL}}{{env "E2E_GC_HOST_PORT" | default "9180"}}{{else}}9080{{end}}'
  GROUNDCONTROL_URL: "http://localhost:{{.GC_HOST_PORT}}"
  GC_INTERNAL_URL: "http://{{.E2E_PREFIX}}gc:8080"
  E2E_NETWORK: '{{if .HARBOR_EXTERNAL}}hs-e2e{{else}}harbor-e2e{{end}}'
  SATELLITE_NETWORKS: '--network {{.E2E_NETWORK}}{{if .HARBOR_EXTERNAL}} --network {{.HARBOR_NETWORK}}{{end}}'
  COMPOSE: '{{if .HARBOR_EXTERNAL}}HARBOR_NETWORK={{.HARBOR_NETWORK}} HARBOR_INTERNAL_URL={{.HARBOR_INTERNAL_URL}} E2E_GC_HOST_PORT={{.GC_HOST_PORT}} docker compose -p hs-e2e -f test/e2e/docker/docker-compose.yml -f test/e2e/docker/docker-compose.external.yml{{else}}docker compose -f test/e2e/docker/docker-compose.yml{{end}}'
  COMPOSE_SERVICES: '{{if .HARBOR_EXTERNAL}}postgres gc{{end}}'
  SATELLITE_CONTAINER: "{{.E2E_PREFIX}}satellite"
  SATELLITE_BYO_CONTAINER: "{{.E2E_PREFIX}}satellite-byo"
  BYO_REGISTRY_CONTAINER: "{{.E2E_PREFIX}}byo-registry"
  SAT_STATE_VOLUME: "{{.E2E_PREFIX}}sat-state-vol"
  SAT_BYO_STATE_VOLUME: "{{.E2E_PREFIX}}sat-byo-state-vol"
  SATELLITE_TOKEN_FILE: "/tmp/{{.E2E_PREFIX}}e2e_satellite_token"
  BYO_SATELLITE_TOKEN_FILE: "/tmp/{{.E2E_PREFIX}}e2e_byo_satellite_token"
  SATELLITE_PROJECT_MARKER: /tmp/hs-e2e-satellite-project-created
  PROJECT_NAME: "{{.E2E_PREFIX}}harbor-satellite"
  PROJECT_NAME_B: "{{.E2E_PREFIX}}harbor-satellite-b"
  REGISTRY_NAME: test-registry
  DEST_NAMESPACE: "{{.E2E_PREFIX}}test-group"
  DEST_NAMESPACE_B: "{{.E2E_PREFIX}}test-group-b"
  CONFIG_NAME: "{{.E2E_PREFIX}}test-config"
  BYO_CONFIG_NAME: "{{.E2E_PREFIX}}byo-config"
  SATELLITE_NAME: "{{.E2E_PREFIX}}test-satellite"
  BYO_SATELLITE_NAME: "{{.E2E_PREFIX}}byo-satellite"
  MULTI_GROUP_SATELLITE_NAME: "{{.E2E_PREFIX}}multi-group-satellite"

tasks:
  test:
    desc: Run full E2E test suite
    cmds:
      - task: setup
      - defer: { task: cleanup }
      - task: wait-harbor
      - task: wait-groundcontrol
      - task: init-harbor
      - task: init-groundcontrol
      - task: register-satellite
      - task: verify

  test-byo:
    desc: Run BYO registry E2E test
    cmds:
      - task: setup
      - defer: { task: cleanup-byo }
      - task: wait-harbor
      - task: wait-groundcontrol
      - task: init-harbor
      - task: init-groundcontrol-byo
      - task: register-satellite-byo
      - task: verify-byo
      - echo "BYO registry E2E test passed"

  test-spiffe:
    desc: Run SPIFFE join token E2E test
    cmds:
      - task: setup-spiffe
      - defer: { task: cleanup-spiffe }
      - task: wait-groundcontrol-spiffe
      - task: generate-join-token
      - task: verify-spiffe-attestation
      - echo "SPIFFE join token E2E test passed"

  test-multi-group:
    desc: Run multi-group E2E test (pending plan item D5, runs with HARBOR3_PENDING=1)
    cmds:
      - cmd: 'echo "SKIP pending plan item D5: robot permissions keep only the projects of the last group (set HARBOR3_PENDING=1 to run)"'
        if: '[ -z "$HARBOR3_PENDING" ]'
      - task: run-multi-group
        if: '[ -n "$HARBOR3_PENDING" ]'

  run-multi-group:
    internal: true
    cmds:
      - task: setup
      - defer: { task: cleanup }
      - task: wait-harbor
      - task: wait-groundcontrol
      - task: init-harbor
      - task: create-harbor-project
        vars: { PROJECT: "{{.PROJECT_NAME_B}}" }
      - task: push-image
        vars: { PROJECT: "{{.PROJECT_NAME_B}}" }
      - task: init-groundcontrol
      - task: init-group-b
      - task: register-satellite-multi-group
      - task: verify-multi-group
      - echo "Multi-group E2E test passed"

  setup:
    desc: Start Harbor and Ground Control stack
    cmds:
      - task: check-external-harbor
        if: '[ -n "{{.HARBOR_EXTERNAL}}" ]'
      - task: cleanup-harbor
        if: '[ -n "{{.HARBOR_EXTERNAL}}" ]'
      - echo "Building Ground Control image..."
      - docker build --build-arg COMPONENT=groundcontrol -t gc:e2e -f Dockerfile .
      - echo "Starting {{if .HARBOR_EXTERNAL}}GC stack against the external Harbor on {{.HARBOR_NETWORK}}{{else}}Harbor and GC stack{{end}}..."
      - "{{.COMPOSE}} up -d{{if .COMPOSE_SERVICES}} {{.COMPOSE_SERVICES}}{{end}}"
      - sleep 5
      - "{{.COMPOSE}} ps"
    silent: true

  check-external-harbor:
    internal: true
    cmds:
      - |
        if [ -z "{{.HARBOR_NETWORK}}" ] || [ -z "{{.HARBOR_URL}}" ]; then
          echo "ERROR: HARBOR_EXTERNAL=1 requires HARBOR_NETWORK and HARBOR_HOST_URL"
          exit 1
        fi
        if ! docker network inspect "{{.HARBOR_NETWORK}}" > /dev/null; then
          echo "ERROR: docker network {{.HARBOR_NETWORK}} does not exist"
          exit 1
        fi
        echo "Using external Harbor {{.HARBOR_URL}} ({{.HARBOR_INTERNAL_URL}} on {{.HARBOR_NETWORK}})"
    silent: true

  setup-spiffe:
    desc: Start SPIFFE test stack with external SPIRE
    cmds:
      - echo "Building Ground Control image..."
      - docker build --build-arg COMPONENT=groundcontrol -t gc:e2e -f Dockerfile .
      - task: generate-spiffe-certs
      - task: start-spire-server
      - task: setup-groundcontrol-agent
      - task: start-groundcontrol-spiffe
    silent: true

  generate-spiffe-certs:
    desc: Generate CA certificates for SPIRE
    cmds:
      - |
        CERTS_DIR="test/e2e/docker/spiffe/certs"
        mkdir -p "$CERTS_DIR"
        echo "Generating bootstrap CA certificate..."
        openssl genrsa -out "$CERTS_DIR/ca.key" 4096 2>/dev/null
        openssl req -new -x509 -days 365 -key "$CERTS_DIR/ca.key" -out "$CERTS_DIR/ca.crt" \
          -subj "/C=US/ST=State/L=City/O=Harbor Satellite/CN=SPIRE CA" 2>/dev/null
        chmod 644 "$CERTS_DIR/ca.key" "$CERTS_DIR/ca.crt"
        echo "CA certificate generated in $CERTS_DIR"
        ls -la "$CERTS_DIR"

  start-spire-server:
    desc: Start PostgreSQL and SPIRE server
    cmds:
      - |
        echo "Starting PostgreSQL and SPIRE server..."
        docker compose -f test/e2e/docker/docker-compose.spiffe.yml up -d postgres spire-server
        echo "Waiting for SPIRE server to be healthy..."
        for i in $(seq 1 60); do
          if docker exec spire-server /opt/spire/bin/spire-server healthcheck -socketPath /tmp/spire-server/private/api.sock > /dev/null 2>&1; then
            echo "SPIRE server is healthy"
            exit 0
          fi
          echo "Waiting for SPIRE server... ($i/60)"
          sleep 2
        done
        echo "ERROR: SPIRE server failed to start"
        echo "SPIRE server logs:"
        docker logs spire-server 2>&1 | tail -50
        exit 1

  setup-groundcontrol-agent:
    desc: Generate join token and start GC SPIRE agent
    cmds:
      - |
        echo "Generating join token for GC SPIRE agent..."
        GC_TOKEN=$(docker exec spire-server /opt/spire/bin/spire-server token generate \
          -spiffeID spiffe://harbor-satellite.local/agent/ground-control \
          -socketPath /tmp/spire-server/private/api.sock | grep "Token:" | awk '{print $2}')
        if [ -z "$GC_TOKEN" ]; then
          echo "ERROR: Failed to generate join token"
          exit 1
        fi
        echo "GC Agent Token: $GC_TOKEN"

        echo "Creating agent config with join token..."
        cat > test/e2e/docker/spiffe/agent-groundcontrol-runtime.conf << EOF
        agent {
            data_dir = "/tmp/spire-agent"
            log_level = "INFO"
            server_address = "spire-server"
            server_port = "8081"
            socket_path = "/run/spire/sockets/agent.sock"
            trust_bundle_path = "/opt/spire/conf/agent/bootstrap.crt"
            trust_domain = "harbor-satellite.local"
            join_token = "$GC_TOKEN"
        }
        plugins {
            NodeAttestor "join_token" {
                plugin_data {}
            }
            KeyManager "memory" {
                plugin_data {}
            }
            WorkloadAttestor "unix" {
                plugin_data {}
            }
            WorkloadAttestor "docker" {
                plugin_data {
                    docker_socket_path = "unix:///var/run/docker.sock"
                }
            }
        }
        health_checks {
            listener_enabled = true
            bind_address = "0.0.0.0"
            bind_port = "8080"
            live_path = "/live"
            ready_path = "/ready"
        }
        EOF

        echo "Starting SPIRE agent for Ground Control..."
        docker compose -f test/e2e/docker/docker-compose.spiffe.yml up -d spire-agent-gc
        sleep 5

        echo "Waiting for agent to attest..."
        for i in $(seq 1 20); do
          if docker exec spire-agent-gc /opt/spire/bin/spire-agent healthcheck -socketPath /run/spire/sockets/agent.sock > /dev/null 2>&1; then
            echo "SPIRE agent is healthy"
            break
          fi
          if [ "$i" -eq 20 ]; then
            echo "ERROR: SPIRE agent failed to attest"
            exit 1
          fi
          echo "Waiting for SPIRE agent... ($i/20)"
          sleep 2
        done

        echo "Registering GC workload entry..."
        docker exec spire-server /opt/spire/bin/spire-server entry create \
          -parentID spiffe://harbor-satellite.local/agent/ground-control \
          -spiffeID spiffe://harbor-satellite.local/ground-control \
          -selector docker:label:com.docker.compose.service:gc \
          -socketPath /tmp/spire-server/private/api.sock || true

  start-groundcontrol-spiffe:
    desc: Start Ground Control with SPIFFE
    cmds:
      - |
        echo "Starting Ground Control..."
        docker compose -f test/e2e/docker/docker-compose.spiffe.yml up -d gc
        echo "Waiting for Ground Control to be healthy..."
        for i in $(seq 1 30); do
          if curl -sfk https://localhost:9080/health > /dev/null 2>&1; then
            echo "Ground Control is healthy"
            exit 0
          fi
          echo "Waiting for Ground Control... ($i/30)"
          sleep 2
        done
        echo "ERROR: Ground Control failed to start"
        docker logs gc 2>&1 | tail -30
        exit 1

  cleanup:
    desc: Stop and remove E2E containers
    cmds:
      - echo "Stopping e2e containers..."
      - docker rm -f {{.SATELLITE_CONTAINER}} 2>/dev/null || true
      - "{{.COMPOSE}} down -v --remove-orphans 2>/dev/null || true"
      - task: cleanup-harbor
        if: '[ -n "{{.HARBOR_EXTERNAL}}" ]'
      - echo "Cleanup complete"
    silent: true

  cleanup-harbor:
    desc: Remove the robots, state artifacts and projects an external-Harbor run created
    internal: true
    cmds:
      - |
        PREFIX="{{.E2E_PREFIX}}"
        if [ -z "$PREFIX" ]; then
          echo "ERROR: cleanup-harbor only runs with HARBOR_EXTERNAL=1"
          exit 1
        fi
        AUTH="{{.HARBOR_ADMIN_USER}}:{{.HARBOR_ADMIN_PASSWORD}}"
        API="{{.HARBOR_API}}"
        echo "Removing Harbor robots, state artifacts and projects named ${PREFIX}*..."

        for id in $(curl -sf -u "$AUTH" "$API/robots?page_size=100&q=name%3D~$PREFIX" | jq -r --arg p "\$$PREFIX" '.[] | select(.name | contains($p)) | .id'); do
          curl -sf -o /dev/null -X DELETE -u "$AUTH" "$API/robots/$id" && echo "Deleted robot $id"
        done

        for repo in $(curl -sf -u "$AUTH" "$API/projects/satellite/repositories?page_size=100&q=name%3D~$PREFIX" | jq -r --arg p "/$PREFIX" '.[] | select(.name | contains($p)) | .name'); do
          encoded=$(printf '%s' "${repo#satellite/}" | sed 's#/#%252F#g')
          curl -sf -o /dev/null -X DELETE -u "$AUTH" "$API/projects/satellite/repositories/$encoded" && echo "Deleted $repo"
        done

        if [ -f "{{.SATELLITE_PROJECT_MARKER}}" ]; then
          if ! satellite_project=$(curl -sf -u "$AUTH" "$API/projects/satellite"); then
            rm -f "{{.SATELLITE_PROJECT_MARKER}}"
          elif [ "$(echo "$satellite_project" | jq -r '.repo_count // 0')" = "0" ]; then
            curl -sf -o /dev/null -X DELETE -u "$AUTH" "$API/projects/satellite" && echo "Deleted project satellite" && rm -f "{{.SATELLITE_PROJECT_MARKER}}"
          else
            echo "Keeping project satellite: it holds repositories this run did not create"
          fi
        fi

        for project in $(curl -sf -u "$AUTH" "$API/projects?page_size=100&name=$PREFIX" | jq -r --arg p "$PREFIX" '.[] | select(.name | startswith($p)) | .name'); do
          for repo in $(curl -sf -u "$AUTH" "$API/projects/$project/repositories?page_size=100" | jq -r '.[].name'); do
            encoded=$(printf '%s' "${repo#"$project"/}" | sed 's#/#%252F#g')
            curl -sf -o /dev/null -X DELETE -u "$AUTH" "$API/projects/$project/repositories/$encoded" && echo "Deleted $repo"
          done
          curl -sf -o /dev/null -X DELETE -u "$AUTH" "$API/projects/$project" && echo "Deleted project $project"
        done
        exit 0
    silent: true

  cleanup-spiffe:
    desc: Stop and remove SPIFFE E2E containers
    cmds:
      - echo "Stopping spiffe containers..."
      - docker compose -f test/e2e/docker/docker-compose.spiffe.yml down -v --remove-orphans 2>/dev/null || true
      - docker rm -f spire-agent-satellite satellite-spiffe 2>/dev/null || true
      - rm -f test/e2e/docker/spiffe/agent-groundcontrol-runtime.conf test/e2e/docker/spiffe/agent-satellite-runtime.conf 2>/dev/null || true
      - rm -rf test/e2e/docker/spiffe/certs 2>/dev/null || true
      - echo "Cleanup complete"
    silent: true

  wait-harbor:
    desc: Wait for Harbor core to be healthy
    cmds:
      - |
        echo "Waiting for Harbor core to be healthy..."
        for i in $(seq 1 30); do
          if curl -sf {{.HARBOR_API}}/health > /dev/null 2>&1; then
            echo "Harbor core is healthy"
            exit 0
          fi
          echo "Waiting for Harbor... ($i/30)"
          sleep 10
        done
        echo "Timeout waiting for Harbor"
        exit 1

  wait-groundcontrol:
    desc: Wait for Ground Control to be healthy
    cmds:
      - |
        echo "Waiting for Ground Control to be healthy..."
        for i in $(seq 1 30); do
          if curl -sf {{.GROUNDCONTROL_URL}}/health > /dev/null 2>&1; then
            echo "Ground Control is healthy"
            exit 0
          fi
          echo "Waiting for GC... ($i/30)"
          sleep 5
        done
        echo "Timeout waiting for Ground Control"
        exit 1

  wait-groundcontrol-spiffe:
    desc: Wait for Ground Control with SPIRE to be healthy
    cmds:
      - |
        echo "Verifying Ground Control and SPIRE are healthy..."
        if ! curl -sfk https://localhost:9080/health > /dev/null 2>&1; then
          echo "ERROR: Ground Control is not healthy"
          exit 1
        fi
        echo "Ground Control is healthy"
        if ! docker exec spire-server /opt/spire/bin/spire-server healthcheck -socketPath /tmp/spire-server/private/api.sock > /dev/null 2>&1; then
          echo "ERROR: SPIRE server is not healthy"
          exit 1
        fi
        echo "SPIRE server is healthy"

  init-harbor:
    desc: Initialize Harbor with project, image, registry, and replication policy
    cmds:
      - task: record-satellite-project
        if: '[ -n "{{.HARBOR_EXTERNAL}}" ]'
      - task: create-harbor-project
        vars: { PROJECT: "{{.PROJECT_NAME}}" }
      - task: push-image
        vars: { PROJECT: "{{.PROJECT_NAME}}" }
      - task: init-harbor-replication

  record-satellite-project:
    desc: Remember whether Ground Control will create the satellite project, so cleanup removes it only then
    internal: true
    cmds:
      - |
        code=$(curl -s -o /dev/null -w '%{http_code}' -I -u {{.HARBOR_ADMIN_USER}}:{{.HARBOR_ADMIN_PASSWORD}} "{{.HARBOR_API}}/projects?project_name=satellite")
        if [ "$code" = "404" ]; then
          touch {{.SATELLITE_PROJECT_MARKER}}
          echo "Harbor project satellite does not exist yet; cleanup removes it if it stays empty"
        fi

  create-harbor-project:
    desc: Create a Harbor project unless it exists
    internal: true
    requires:
      vars: [PROJECT]
    cmds:
      - |
        echo "Creating project {{.PROJECT}}..."
        code=$(curl -s -o /dev/null -w '%{http_code}' -X POST {{.HARBOR_API}}/projects \
          -u {{.HARBOR_ADMIN_USER}}:{{.HARBOR_ADMIN_PASSWORD}} \
          -H "Content-Type: application/json" \
          -d '{"project_name": "{{.PROJECT}}"}')
        case "$code" in
          201) ;;
          409) echo "Project {{.PROJECT}} already exists" ;;
          *) echo "ERROR: creating project {{.PROJECT}} returned HTTP $code"; exit 1 ;;
        esac

  push-image:
    desc: Push alpine:latest into a Harbor project
    internal: true
    requires:
      vars: [PROJECT]
    cmds:
      - |
        echo "Pulling alpine locally (avoids Docker Hub rate limits in container)..."
        docker pull alpine:latest || { echo "Failed to pull alpine:latest"; exit 1; }
        {{if .HARBOR_EXTERNAL}}
        # The Docker Desktop daemon cannot reach a published Harbor port and the
        # token realm only resolves on Harbor's network, so push from a container there.
        echo "Pushing image to {{.HARBOR_INTERNAL_HOST}}/{{.PROJECT}} from a container on {{.HARBOR_NETWORK}}..."
        docker save alpine:latest | docker run -i --rm --network {{.HARBOR_NETWORK}} alpine:latest sh -c '
          apk add --no-cache crane > /dev/null &&
          cat > /tmp/image.tar &&
          crane auth login {{.HARBOR_INTERNAL_HOST}} -u {{.HARBOR_ADMIN_USER}} -p {{.HARBOR_ADMIN_PASSWORD}} > /dev/null &&
          crane push --insecure /tmp/image.tar {{.HARBOR_INTERNAL_HOST}}/{{.PROJECT}}/alpine:latest
        '
        {{else}}
        echo "Pushing image to Harbor..."
        docker tag alpine:latest localhost:8080/{{.PROJECT}}/alpine:latest

        # Try docker login/push (Docker), fallback to podman flags (Podman)
        if docker login localhost:8080 -u admin -p Harbor12345 2>/dev/null; then
          docker push localhost:8080/{{.PROJECT}}/alpine:latest 2>/dev/null || \
          docker push localhost:8080/{{.PROJECT}}/alpine:latest --tls-verify=false
        else
          docker login localhost:8080 -u admin -p Harbor12345 --tls-verify=false
          docker push localhost:8080/{{.PROJECT}}/alpine:latest --tls-verify=false
        fi
        {{end}}

  init-harbor-replication:
    desc: Create the satellite replication registry and policy in the bundled Harbor
    internal: true
    cmds:
      - |
        {{if .HARBOR_EXTERNAL}}
        echo "Skipping replication registry and policy: the satellite flow does not use them and an external Harbor may lack the harbor-satellite adapter"
        {{else}}
        echo "Creating registry..."
        curl -sf -X POST {{.HARBOR_API}}/registries \
          -u {{.HARBOR_ADMIN_USER}}:{{.HARBOR_ADMIN_PASSWORD}} \
          -H "Content-Type: application/json" \
          -d '{
            "credential": {"access_key": "", "access_secret": "", "type": "basic"},
            "description": "",
            "insecure": true,
            "name": "{{.REGISTRY_NAME}}",
            "type": "harbor-satellite",
            "url": "http://gc:8080/groups/sync"
          }'

        echo "Creating replication policy..."
        curl -sf -X POST {{.HARBOR_API}}/replication/policies \
          -u {{.HARBOR_ADMIN_USER}}:{{.HARBOR_ADMIN_PASSWORD}} \
          -H "Content-Type: application/json" \
          -d '{
            "name": "satellite-group",
            "dest_registry": {
              "id": 1,
              "name": "{{.REGISTRY_NAME}}",
              "status": "healthy",
              "type": "harbor-satellite",
              "url": "http://gc:8080/groups/sync"
            },
            "dest_namespace": "{{.DEST_NAMESPACE}}",
            "dest_namespace_replace_count": 1,
            "trigger": {"type": "manual", "trigger_settings": {"cron": ""}},
            "filters": [{"type": "name", "value": "{{.PROJECT_NAME}}/**"}],
            "enabled": true,
            "deletion": false,
            "override": true,
            "speed": -1
          }'

        echo "Executing replication..."
        curl -sf -X POST {{.HARBOR_API}}/replication/executions \
          -u {{.HARBOR_ADMIN_USER}}:{{.HARBOR_ADMIN_PASSWORD}} \
          -H "Content-Type: application/json" \
          -d '{"policy_id": 1}'
        {{end}}
        echo "Harbor initialized"

  init-groundcontrol:
    desc: Initialize Ground Control with config and group
    vars:
      GC_TOKEN:
        sh: |
          curl -sf -X POST {{.GROUNDCONTROL_URL}}/login \
            -H "Content-Type: application/json" \
            -d '{"username":"{{.GROUNDCONTROL_ADMIN_USER}}","password":"{{.GROUNDCONTROL_ADMIN_PASSWORD}}"}' | \
            grep -o '"token":"[^"]*"' | cut -d'"' -f4
    cmds:
      - |
        echo "Creating config..."
        curl -sf -X POST {{.GROUNDCONTROL_URL}}/api/configs \
          -H "Authorization: Bearer {{.GC_TOKEN}}" \
          -H "Content-Type: application/json" \
          -d '{
            "config_name": "{{.CONFIG_NAME}}",
            "registry": "{{.HARBOR_INTERNAL_URL}}",
            "config": {
              "app_config": {
                "ground_control_url": "{{.GC_INTERNAL_URL}}",
                "log_level": "info",
                "use_unsecure": true,
                "state_replication_interval": "@every 00h00m10s",
                "register_satellite_interval": "@every 00h00m10s",
                "bring_own_registry": false
              }
            }
          }'

        echo "Creating group..."
        curl -sf -X POST {{.GROUNDCONTROL_URL}}/api/groups/sync \
          -H "Authorization: Bearer {{.GC_TOKEN}}" \
          -H "Content-Type: application/json" \
          -d '{
            "group": "{{.DEST_NAMESPACE}}",
            "registry": "{{.HARBOR_INTERNAL_URL}}",
            "artifacts": [{"repository": "{{.PROJECT_NAME}}/alpine", "tag": ["latest"]}]
          }'

        echo "Ground Control initialized"

  init-group-b:
    desc: Create a second group backed by a second Harbor project
    internal: true
    vars:
      GC_TOKEN:
        sh: |
          curl -sf -X POST {{.GROUNDCONTROL_URL}}/login \
            -H "Content-Type: application/json" \
            -d '{"username":"{{.GROUNDCONTROL_ADMIN_USER}}","password":"{{.GROUNDCONTROL_ADMIN_PASSWORD}}"}' | \
            grep -o '"token":"[^"]*"' | cut -d'"' -f4
    cmds:
      - |
        echo "Creating group {{.DEST_NAMESPACE_B}}..."
        curl -sf -X POST {{.GROUNDCONTROL_URL}}/api/groups/sync \
          -H "Authorization: Bearer {{.GC_TOKEN}}" \
          -H "Content-Type: application/json" \
          -d '{
            "group": "{{.DEST_NAMESPACE_B}}",
            "registry": "{{.HARBOR_INTERNAL_URL}}",
            "artifacts": [{"repository": "{{.PROJECT_NAME_B}}/alpine", "tag": ["latest"]}]
          }'

  register-satellite:
    desc: Register satellite and start it
    vars:
      GC_TOKEN:
        sh: |
          curl -sf -X POST {{.GROUNDCONTROL_URL}}/login \
            -H "Content-Type: application/json" \
            -d '{"username":"{{.GROUNDCONTROL_ADMIN_USER}}","password":"{{.GROUNDCONTROL_ADMIN_PASSWORD}}"}' | \
            grep -o '"token":"[^"]*"' | cut -d'"' -f4
    cmds:
      - |
        echo "Registering satellite..."
        RESPONSE=$(curl -sf -X POST {{.GROUNDCONTROL_URL}}/api/satellites \
          -H "Authorization: Bearer {{.GC_TOKEN}}" \
          -H "Content-Type: application/json" \
          -d '{
            "name": "{{.SATELLITE_NAME}}",
            "groups": ["{{.DEST_NAMESPACE}}"],
            "config_name": "{{.CONFIG_NAME}}"
          }')

        TOKEN=$(echo "$RESPONSE" | grep -o '"token":"[^"]*"' | cut -d'"' -f4)
        if [ -z "$TOKEN" ]; then
          echo "Failed to get satellite token"
          exit 1
        fi
        echo "Satellite registered with token: $TOKEN"

        echo "Building satellite from local code..."
        docker build -t satellite:e2e -f Dockerfile .

        echo "Starting satellite..."
        docker run -d --name {{.SATELLITE_CONTAINER}} {{.SATELLITE_NETWORKS}} \
          -e TOKEN="$TOKEN" \
          -e GROUND_CONTROL_URL="{{.GC_INTERNAL_URL}}" \
          -e HARBOR_REGISTRY_URL="{{.HARBOR_INTERNAL_URL}}" \
          -e REGISTRY_DATA_DIR=/data/oci \
          -e JSON_LOGGING=true \
          satellite:e2e

        echo "Waiting for satellite OCI store to initialize..."
        sleep 5
        echo "--- Early satellite logs ---"
        docker logs {{.SATELLITE_CONTAINER}} 2>&1 | head -30
        echo "---"

  register-satellite-multi-group:
    desc: Register one satellite in two groups and start it
    internal: true
    vars:
      GC_TOKEN:
        sh: |
          curl -sf -X POST {{.GROUNDCONTROL_URL}}/login \
            -H "Content-Type: application/json" \
            -d '{"username":"{{.GROUNDCONTROL_ADMIN_USER}}","password":"{{.GROUNDCONTROL_ADMIN_PASSWORD}}"}' | \
            grep -o '"token":"[^"]*"' | cut -d'"' -f4
    cmds:
      - |
        echo "Registering satellite in groups {{.DEST_NAMESPACE}} and {{.DEST_NAMESPACE_B}}..."
        RESPONSE=$(curl -sf -X POST {{.GROUNDCONTROL_URL}}/api/satellites \
          -H "Authorization: Bearer {{.GC_TOKEN}}" \
          -H "Content-Type: application/json" \
          -d '{
            "name": "{{.MULTI_GROUP_SATELLITE_NAME}}",
            "groups": ["{{.DEST_NAMESPACE}}", "{{.DEST_NAMESPACE_B}}"],
            "config_name": "{{.CONFIG_NAME}}"
          }')

        TOKEN=$(echo "$RESPONSE" | grep -o '"token":"[^"]*"' | cut -d'"' -f4)
        if [ -z "$TOKEN" ]; then
          echo "Failed to get satellite token: $RESPONSE"
          exit 1
        fi

        echo "Building satellite from local code..."
        docker build -t satellite:e2e -f Dockerfile .

        echo "Starting satellite..."
        docker run -d --name {{.SATELLITE_CONTAINER}} {{.SATELLITE_NETWORKS}} \
          -e TOKEN="$TOKEN" \
          -e GROUND_CONTROL_URL="{{.GC_INTERNAL_URL}}" \
          -e HARBOR_REGISTRY_URL="{{.HARBOR_INTERNAL_URL}}" \
          -e REGISTRY_DATA_DIR=/data/oci \
          -e JSON_LOGGING=true \
          satellite:e2e

  verify:
    desc: Verify image replication to the local OCI layout, a proxy pull and the heartbeat
    cmds:
      - |
        echo "Waiting for replication..."
        for i in $(seq 1 12); do
          echo "Checking replication status... ($i/12)"
          if docker exec {{.SATELLITE_CONTAINER}} sh -c '
            test -f /data/oci/oci-layout &&
            test -f /data/oci/index.json &&
            grep -q "alpine:latest" /data/oci/index.json &&
            test -n "$(find /data/oci/blobs/sha256 -type f -print -quit)"
          '; then
            echo "E2E test passed: OCI content replicated successfully"
            exit 0
          fi
          sleep 10
        done
        echo "Timeout waiting for replication"
        echo "--- Full satellite logs ---"
        docker logs {{.SATELLITE_CONTAINER}} 2>&1
        echo "---"
        exit 1
      - task: verify-proxy-pull
        vars: { CONTAINER: "{{.SATELLITE_CONTAINER}}" }
      - task: verify-heartbeat
        vars: { SATELLITE: "{{.SATELLITE_NAME}}", CONTAINER: "{{.SATELLITE_CONTAINER}}" }

  verify-multi-group:
    desc: Verify the satellite replicated the images of both groups (pending plan item D5)
    internal: true
    cmds:
      - |
        echo "Waiting for images from both groups..."
        for i in $(seq 1 12); do
          echo "Checking replication status... ($i/12)"
          if docker exec {{.SATELLITE_CONTAINER}} sh -c '
            grep -q "\"{{.PROJECT_NAME}}/alpine:latest\"" /data/oci/index.json &&
            grep -q "\"{{.PROJECT_NAME_B}}/alpine:latest\"" /data/oci/index.json
          '; then
            echo "PASS: images from {{.PROJECT_NAME}} and {{.PROJECT_NAME_B}} replicated"
            exit 0
          fi
          sleep 10
        done
        echo "FAIL: the satellite did not replicate the images of both groups"
        echo "--- index.json ---"
        docker exec {{.SATELLITE_CONTAINER}} cat /data/oci/index.json 2>&1 || true
        echo
        echo "--- satellite errors ---"
        docker logs {{.SATELLITE_CONTAINER}} 2>&1 | grep -iE '"level":"(error|warn)"' | tail -20
        exit 1

  verify-proxy-pull:
    desc: Pull the replicated image through the satellite's loopback OCI proxy and check digests
    internal: true
    requires:
      vars: [CONTAINER]
    vars:
      REPOSITORY: "{{.PROJECT_NAME}}/alpine"
      PROXY_URL: http://127.0.0.1:8585
    cmds:
      - |
        ACCEPT="application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json"
        fail() {
          echo "FAIL: $1"
          echo "--- satellite logs ---"
          docker logs {{.CONTAINER}} 2>&1 | tail -30
          exit 1
        }
        proxy_get() {
          docker exec {{.CONTAINER}} curl -sf -H "Accept: $ACCEPT" "{{.PROXY_URL}}/v2/{{.REPOSITORY}}/$1"
        }
        proxy_header_digest() {
          docker exec {{.CONTAINER}} curl -sf -o /dev/null -D - -H "Accept: $ACCEPT" "{{.PROXY_URL}}/v2/{{.REPOSITORY}}/$1" |
            tr -d '\r' | awk 'tolower($1) == "docker-content-digest:" { print $2 }'
        }
        proxy_body_digest() {
          echo "sha256:$(docker exec {{.CONTAINER}} sh -c "curl -sf -H '$ACCEPT' '{{.PROXY_URL}}/v2/{{.REPOSITORY}}/$1' | sha256sum" | cut -d' ' -f1)"
        }

        EXPECTED=$(curl -sf -u {{.HARBOR_ADMIN_USER}}:{{.HARBOR_ADMIN_PASSWORD}} \
          "{{.HARBOR_API}}/projects/{{.PROJECT_NAME}}/repositories/alpine/artifacts/latest" | jq -r '.digest // empty')
        [ -n "$EXPECTED" ] || fail "Harbor did not return the digest of {{.REPOSITORY}}:latest"
        echo "Pulling {{.REPOSITORY}}:latest through the proxy in {{.CONTAINER}} (Harbor digest $EXPECTED)..."

        HEADER_DIGEST=$(proxy_header_digest manifests/latest)
        [ "$HEADER_DIGEST" = "$EXPECTED" ] || fail "proxy Docker-Content-Digest is '$HEADER_DIGEST', want $EXPECTED"
        BODY_DIGEST=$(proxy_body_digest manifests/latest)
        [ "$BODY_DIGEST" = "$EXPECTED" ] || fail "proxy manifest body digest is $BODY_DIGEST, want $EXPECTED"

        MANIFEST=$(proxy_get manifests/latest) || fail "proxy GET manifests/latest failed"
        if echo "$MANIFEST" | jq -e '.manifests' > /dev/null; then
          CHILD=$(echo "$MANIFEST" | jq -r '[.manifests[] | select(.platform.os != "unknown")][0].digest')
          [ "$(proxy_body_digest "manifests/$CHILD")" = "$CHILD" ] || fail "proxy child manifest $CHILD has a different digest"
          MANIFEST=$(proxy_get "manifests/$CHILD") || fail "proxy GET manifests/$CHILD failed"
        fi
        LAYER=$(echo "$MANIFEST" | jq -r '.layers[0].digest // empty')
        [ -n "$LAYER" ] || fail "manifest has no layers"
        LAYER_DIGEST=$(proxy_body_digest "blobs/$LAYER")
        [ "$LAYER_DIGEST" = "$LAYER" ] || fail "proxy blob body digest is $LAYER_DIGEST, want $LAYER"
        echo "PASS: proxy served manifest $EXPECTED and blob $LAYER with matching digests"

  verify-heartbeat:
    desc: Require a recent heartbeat in GET /api/satellites/{satellite}/status (pending plan item D1)
    internal: true
    requires:
      vars: [SATELLITE, CONTAINER]
    cmds:
      - |
        if [ -z "$HARBOR3_PENDING" ]; then
          echo "SKIP pending plan item D1: heartbeat of {{.SATELLITE}} not checked (set HARBOR3_PENDING=1 to run)"
          exit 0
        fi
        GC_TOKEN=$(curl -sf -X POST {{.GROUNDCONTROL_URL}}/login \
          -H "Content-Type: application/json" \
          -d '{"username":"{{.GROUNDCONTROL_ADMIN_USER}}","password":"{{.GROUNDCONTROL_ADMIN_PASSWORD}}"}' | jq -r '.token')
        echo "Waiting for two consecutive heartbeats of {{.SATELLITE}}..."
        FIRST=""
        for i in $(seq 1 24); do
          SEEN=$(curl -sf -H "Authorization: Bearer $GC_TOKEN" "{{.GROUNDCONTROL_URL}}/api/satellites/{{.SATELLITE}}/status" |
            jq -r '.CreatedAt // .created_at // empty' 2>/dev/null)
          if [ -n "$SEEN" ] && [ -z "$FIRST" ]; then
            FIRST="$SEEN"
            echo "Heartbeat recorded at $FIRST"
          elif [ -n "$SEEN" ] && [ "$SEEN" != "$FIRST" ]; then
            echo "PASS: heartbeat recorded at $SEEN after $FIRST"
            exit 0
          fi
          echo "Waiting for heartbeat... ($i/24)"
          sleep 5
        done
        echo "FAIL: no recent heartbeat for {{.SATELLITE}}"
        curl -s -H "Authorization: Bearer $GC_TOKEN" "{{.GROUNDCONTROL_URL}}/api/satellites/{{.SATELLITE}}/status"
        echo
        echo "--- satellite status report logs ---"
        docker logs {{.CONTAINER}} 2>&1 | grep '"process":"status_report"' | tail -5
        echo "--- Ground Control logs ---"
        docker logs {{.E2E_PREFIX}}gc 2>&1 | tail -20
        exit 1

  generate-join-token:
    desc: Register satellite and generate SPIFFE join token
    vars:
      GC_TOKEN:
        sh: |
          curl -sfk -X POST https://localhost:9080/login \
            -H "Content-Type: application/json" \
            -d '{"username":"{{.GROUNDCONTROL_ADMIN_USER}}","password":"{{.GROUNDCONTROL_ADMIN_PASSWORD}}"}' | \
            grep -o '"token":"[^"]*"' | cut -d'"' -f4
    cmds:
      - |
        echo "Registering satellite with SPIFFE attestation..."
        RESPONSE=$(curl -sfk -X POST https://localhost:9080/api/satellites/register \
          -H "Authorization: Bearer {{.GC_TOKEN}}" \
          -H "Content-Type: application/json" \
          -d '{
            "satellite_name": "test-satellite",
            "region": "us-west",
            "selectors": ["docker:label:com.docker.compose.service:satellite-spiffe"],
            "attestation_method": "join_token"
          }')

        JOIN_TOKEN=$(echo "$RESPONSE" | grep -o '"join_token":"[^"]*"' | cut -d'"' -f4)
        SPIFFE_ID=$(echo "$RESPONSE" | grep -o '"spiffe_id":"[^"]*"' | cut -d'"' -f4)

        if [ -z "$JOIN_TOKEN" ]; then
          echo "Failed to get join token"
          echo "Response: $RESPONSE"
          exit 1
        fi

        echo "Satellite registered with SPIFFE"
        echo "SPIFFE ID: $SPIFFE_ID"
        echo "Join token: $JOIN_TOKEN"
        echo "$JOIN_TOKEN" > /tmp/spiffe_join_token

  verify-spiffe-attestation:
    desc: Verify SPIFFE agent attestation with join token
    cmds:
      - |
        JOIN_TOKEN=$(cat /tmp/spiffe_join_token)

        echo "Creating satellite agent config with join token..."
        cat > test/e2e/docker/spiffe/agent-satellite-runtime.conf << EOF
        agent {
            data_dir = "/tmp/spire-agent"
            log_level = "INFO"
            server_address = "spire-server"
            server_port = "8081"
            socket_path = "/run/spire/sockets/agent.sock"
            trust_bundle_path = "/opt/spire/conf/agent/bootstrap.crt"
            trust_domain = "harbor-satellite.local"
            join_token = "$JOIN_TOKEN"
        }
        plugins {
            NodeAttestor "join_token" {
                plugin_data {}
            }
            KeyManager "memory" {
                plugin_data {}
            }
            WorkloadAttestor "unix" {
                plugin_data {}
            }
            WorkloadAttestor "docker" {
                plugin_data {
                    docker_socket_path = "unix:///var/run/docker.sock"
                }
            }
        }
        health_checks {
            listener_enabled = true
            bind_address = "0.0.0.0"
            bind_port = "8080"
            live_path = "/live"
            ready_path = "/ready"
        }
        EOF

        echo "Starting SPIRE agent for satellite..."
        docker run -d --name spire-agent-satellite \
          --network spiffe-e2e \
          --pid host \
          -v $(pwd)/test/e2e/docker/spiffe/agent-satellite-runtime.conf:/opt/spire/conf/agent/agent.conf:ro \
          -v $(pwd)/test/e2e/docker/spiffe/certs/ca.crt:/opt/spire/conf/agent/bootstrap.crt:ro \
          -v ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:ro \
          ghcr.io/spiffe/spire-agent:1.12.3 \
          -config /opt/spire/conf/agent/agent.conf

        echo "Waiting for satellite agent to attest..."
        sleep 5

        for i in $(seq 1 20); do
          if docker exec spire-agent-satellite /opt/spire/bin/spire-agent healthcheck -socketPath /run/spire/sockets/agent.sock > /dev/null 2>&1; then
            echo "Satellite SPIRE agent is healthy - attestation successful"
            break
          fi
          if [ "$i" -eq 20 ]; then
            echo "ERROR: Satellite SPIRE agent failed to attest"
            docker logs spire-agent-satellite 2>&1 | tail -30
            exit 1
          fi
          echo "Waiting for satellite SPIRE agent... ($i/20)"
          sleep 2
        done

        echo "Verifying agent is registered with SPIRE server..."
        docker exec spire-server /opt/spire/bin/spire-server agent list \
          -socketPath /tmp/spire-server/private/api.sock

        echo "SPIFFE join token attestation verified successfully"

  init-groundcontrol-byo:
    desc: Initialize Ground Control with BYO registry config
    cmds:
      - |
        GC_TOKEN=$(curl -sf -X POST {{.GROUNDCONTROL_URL}}/login \
          -H "Content-Type: application/json" \
          -d '{"username":"{{.GROUNDCONTROL_ADMIN_USER}}","password":"{{.GROUNDCONTROL_ADMIN_PASSWORD}}"}' | \
          grep -o '"token":"[^"]*"' | cut -d'"' -f4)
        if [ -z "$GC_TOKEN" ]; then
          echo "ERROR: Failed to get GC token"
          exit 1
        fi

        echo "Creating BYO config..."
        RESP=$(curl -s -w '\n%{http_code}' -X POST {{.GROUNDCONTROL_URL}}/api/configs \
          -H "Authorization: Bearer $GC_TOKEN" \
          -H "Content-Type: application/json" \
          -d '{
            "config_name": "{{.BYO_CONFIG_NAME}}",
            "registry": "{{.HARBOR_INTERNAL_URL}}",
            "config": {
              "app_config": {
                "ground_control_url": "{{.GC_INTERNAL_URL}}",
                "log_level": "info",
                "use_unsecure": true,
                "state_replication_interval": "@every 00h00m10s",
                "register_satellite_interval": "@every 00h00m10s",
                "bring_own_registry": true,
                "local_registry": {"url": "http://{{.BYO_REGISTRY_CONTAINER}}:5000"}
              }
            }
          }')
        HTTP_CODE=$(echo "$RESP" | tail -1)
        BODY=$(echo "$RESP" | sed '$d')
        if [ "$HTTP_CODE" -ge 400 ]; then
          echo "ERROR: Config creation failed (HTTP $HTTP_CODE): $BODY"
          exit 1
        fi
        echo "Config created (HTTP $HTTP_CODE)"

        echo "Creating group..."
        curl -sf -X POST {{.GROUNDCONTROL_URL}}/api/groups/sync \
          -H "Authorization: Bearer $GC_TOKEN" \
          -H "Content-Type: application/json" \
          -d '{
            "group": "{{.DEST_NAMESPACE}}",
            "registry": "{{.HARBOR_INTERNAL_URL}}",
            "artifacts": [{"repository": "{{.PROJECT_NAME}}/alpine", "tag": ["latest"]}]
          }'

        echo "Ground Control initialized for BYO"

  register-satellite-byo:
    desc: Register satellite with BYO registry and start it
    cmds:
      - |
        GC_TOKEN=$(curl -sf -X POST {{.GROUNDCONTROL_URL}}/login \
          -H "Content-Type: application/json" \
          -d '{"username":"{{.GROUNDCONTROL_ADMIN_USER}}","password":"{{.GROUNDCONTROL_ADMIN_PASSWORD}}"}' | \
          grep -o '"token":"[^"]*"' | cut -d'"' -f4)
        if [ -z "$GC_TOKEN" ]; then
          echo "ERROR: Failed to get GC token"
          exit 1
        fi

        echo "Registering satellite..."
        RESPONSE=$(curl -sf -X POST {{.GROUNDCONTROL_URL}}/api/satellites \
          -H "Authorization: Bearer $GC_TOKEN" \
          -H "Content-Type: application/json" \
          -d '{
            "name": "{{.BYO_SATELLITE_NAME}}",
            "groups": ["{{.DEST_NAMESPACE}}"],
            "config_name": "{{.BYO_CONFIG_NAME}}"
          }')

        TOKEN=$(echo "$RESPONSE" | grep -o '"token":"[^"]*"' | cut -d'"' -f4)
        if [ -z "$TOKEN" ]; then
          echo "Failed to get satellite token"
          exit 1
        fi
        echo "Satellite registered with token: $TOKEN"

        echo "Starting BYO registry (registry:2)..."
        docker run -d --name {{.BYO_REGISTRY_CONTAINER}} --network {{.E2E_NETWORK}} \
          -e REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY=/var/lib/registry \
          -e REGISTRY_HTTP_ADDR=0.0.0.0:5000 \
          registry:2

        echo "Waiting for BYO registry to be healthy..."
        for i in $(seq 1 15); do
          if docker exec {{.BYO_REGISTRY_CONTAINER}} wget -q -O - http://localhost:5000/v2/ > /dev/null 2>&1; then
            echo "BYO registry is healthy"
            break
          fi
          if [ "$i" -eq 15 ]; then
            echo "ERROR: BYO registry failed to start"
            docker logs {{.BYO_REGISTRY_CONTAINER}} 2>&1 | tail -20
            exit 1
          fi
          echo "Waiting for BYO registry... ($i/15)"
          sleep 2
        done

        echo "Building satellite from local code..."
        docker build -t satellite:e2e -f Dockerfile .

        echo "Starting satellite in BYO mode..."
        docker run -d --name {{.SATELLITE_BYO_CONTAINER}} {{.SATELLITE_NETWORKS}} \
          -e TOKEN="$TOKEN" \
          -e GROUND_CONTROL_URL="{{.GC_INTERNAL_URL}}" \
          -e HARBOR_REGISTRY_URL="{{.HARBOR_INTERNAL_URL}}" \
          -e BYO_REGISTRY=true \
          -e REGISTRY_URL=http://{{.BYO_REGISTRY_CONTAINER}}:5000 \
          -e USE_UNSECURE=true \
          satellite:e2e

  verify-byo:
    desc: Verify image replication to BYO registry, a proxy pull and the heartbeat
    cmds:
      - |
        echo "Waiting for replication to BYO registry..."
        for i in $(seq 1 12); do
          echo "Checking BYO registry... ($i/12)"
          if docker run --rm --network {{.E2E_NETWORK}} alpine:latest sh -c "
            apk add --no-cache crane > /dev/null 2>&1 &&
            crane manifest {{.BYO_REGISTRY_CONTAINER}}:5000/{{.PROJECT_NAME}}/alpine:latest --insecure > /dev/null 2>&1
          "; then
            echo "Image available in BYO registry, pulling..."
            docker run --rm --network {{.E2E_NETWORK}} alpine:latest sh -c "
              apk add --no-cache crane &&
              crane pull {{.BYO_REGISTRY_CONTAINER}}:5000/{{.PROJECT_NAME}}/alpine:latest alpine.tar --insecure &&
              tar -xf alpine.tar &&
              cat manifest.json
            "
            echo "BYO E2E test passed: Image replicated to external registry"
            exit 0
          fi
          sleep 10
        done
        echo "Timeout waiting for BYO replication"
        echo "Satellite logs:"
        docker logs {{.SATELLITE_BYO_CONTAINER}} 2>&1 | tail -50
        echo "BYO registry catalog:"
        docker exec {{.BYO_REGISTRY_CONTAINER}} wget -q -O - http://localhost:5000/v2/_catalog 2>&1 || true
        exit 1
      - task: verify-proxy-pull
        vars: { CONTAINER: "{{.SATELLITE_BYO_CONTAINER}}" }
      - task: verify-heartbeat
        vars: { SATELLITE: "{{.BYO_SATELLITE_NAME}}", CONTAINER: "{{.SATELLITE_BYO_CONTAINER}}" }

  cleanup-byo:
    desc: Stop and remove BYO E2E containers
    cmds:
      - echo "Stopping BYO e2e containers..."
      - docker rm -f {{.SATELLITE_BYO_CONTAINER}} {{.BYO_REGISTRY_CONTAINER}} 2>/dev/null || true
      - "{{.COMPOSE}} down -v --remove-orphans 2>/dev/null || true"
      - task: cleanup-harbor
        if: '[ -n "{{.HARBOR_EXTERNAL}}" ]'
      - echo "BYO cleanup complete"
    silent: true

  test-crash-recovery:
    desc: Test crash recovery with the local OCI store
    cmds:
      - task: setup
      - defer: { task: cleanup-crash-recovery }
      - task: wait-harbor
      - task: wait-groundcontrol
      - task: init-harbor
      - task: init-groundcontrol
      - task: register-and-run-satellite-with-volume
      - task: verify
      - task: crash-and-restart-satellite
      - task: verify-crash-recovery
      - echo "Crash recovery E2E test passed"

  test-crash-recovery-byo:
    desc: Test crash recovery with BYO registry
    cmds:
      - task: setup
      - defer: { task: cleanup-crash-recovery-byo }
      - task: wait-harbor
      - task: wait-groundcontrol
      - task: init-harbor
      - task: init-groundcontrol-byo
      - task: register-and-run-satellite-byo-with-volume
      - task: verify-byo
      - task: crash-and-restart-satellite-byo
      - task: verify-crash-recovery-byo
      - echo "Crash recovery BYO E2E test passed"

  register-and-run-satellite-with-volume:
    desc: Register satellite and start it with a named volume for state persistence
    vars:
      GC_TOKEN:
        sh: |
          curl -sf -X POST {{.GROUNDCONTROL_URL}}/login \
            -H "Content-Type: application/json" \
            -d '{"username":"{{.GROUNDCONTROL_ADMIN_USER}}","password":"{{.GROUNDCONTROL_ADMIN_PASSWORD}}"}' | \
            grep -o '"token":"[^"]*"' | cut -d'"' -f4
    cmds:
      - |
        echo "Registering satellite..."
        RESPONSE=$(curl -sf -X POST {{.GROUNDCONTROL_URL}}/api/satellites \
          -H "Authorization: Bearer {{.GC_TOKEN}}" \
          -H "Content-Type: application/json" \
          -d '{
            "name": "{{.SATELLITE_NAME}}",
            "groups": ["{{.DEST_NAMESPACE}}"],
            "config_name": "{{.CONFIG_NAME}}"
          }')

        TOKEN=$(echo "$RESPONSE" | grep -o '"token":"[^"]*"' | cut -d'"' -f4)
        if [ -z "$TOKEN" ]; then
          echo "Failed to get satellite token"
          exit 1
        fi
        echo "Satellite registered with token: $TOKEN"
        echo "$TOKEN" > {{.SATELLITE_TOKEN_FILE}}

        echo "Building satellite from local code..."
        docker build -t satellite:e2e -f Dockerfile .

        echo "Starting satellite with named volume..."
        docker run -d --name {{.SATELLITE_CONTAINER}} {{.SATELLITE_NETWORKS}} \
          -v {{.SAT_STATE_VOLUME}}:/data \
          -e TOKEN="$TOKEN" \
          -e GROUND_CONTROL_URL="{{.GC_INTERNAL_URL}}" \
          -e HARBOR_REGISTRY_URL="{{.HARBOR_INTERNAL_URL}}" \
          -e CONFIG_DIR=/data \
          satellite:e2e

  crash-and-restart-satellite:
    desc: Kill satellite and restart it to test crash recovery
    cmds:
      - |
        TOKEN=$(cat {{.SATELLITE_TOKEN_FILE}})

        echo "Killing satellite (SIGKILL to simulate crash)..."
        docker kill {{.SATELLITE_CONTAINER}}
        docker rm {{.SATELLITE_CONTAINER}}

        echo "Restarting satellite with same volume..."
        docker run -d --name {{.SATELLITE_CONTAINER}} {{.SATELLITE_NETWORKS}} \
          -v {{.SAT_STATE_VOLUME}}:/data \
          -e TOKEN="$TOKEN" \
          -e GROUND_CONTROL_URL="{{.GC_INTERNAL_URL}}" \
          -e HARBOR_REGISTRY_URL="{{.HARBOR_INTERNAL_URL}}" \
          -e CONFIG_DIR=/data \
          satellite:e2e

        echo "Waiting for satellite to start..."
        sleep 15

  verify-crash-recovery:
    desc: Verify satellite recovered from crash without full re-replication
    cmds:
      - |
        echo "Checking satellite logs for crash recovery..."

        if docker logs {{.SATELLITE_CONTAINER}} 2>&1 | tail -100 | grep -q "Old state has zero entities, replicating the complete state"; then
          echo "FAIL: Satellite re-replicated the complete state after crash"
          docker logs {{.SATELLITE_CONTAINER}} 2>&1 | tail -50
          exit 1
        fi
        echo "PASS: No full re-replication detected"

        if docker logs {{.SATELLITE_CONTAINER}} 2>&1 | tail -100 | grep -q "Total artifacts to replicate: 0"; then
          echo "PASS: Zero artifacts to replicate after restart"
        else
          echo "WARN: Could not confirm zero artifacts to replicate (may still be syncing)"
        fi

        echo "Verifying OCI content is still present..."
        for i in $(seq 1 6); do
          if docker exec {{.SATELLITE_CONTAINER}} sh -c '
            test -f /data/oci/index.json &&
            grep -q "alpine:latest" /data/oci/index.json
          '; then
            echo "PASS: OCI content is still present after crash recovery"
            exit 0
          fi
          echo "Waiting for image availability... ($i/6)"
          sleep 5
        done
        echo "FAIL: OCI content missing after crash recovery"
        docker logs {{.SATELLITE_CONTAINER}} 2>&1 | tail -50
        exit 1

  cleanup-crash-recovery:
    desc: Stop and remove crash recovery E2E containers
    cmds:
      - echo "Stopping crash recovery containers..."
      - docker rm -f {{.SATELLITE_CONTAINER}} 2>/dev/null || true
      - "{{.COMPOSE}} down -v --remove-orphans 2>/dev/null || true"
      - docker volume rm -f {{.SAT_STATE_VOLUME}} 2>/dev/null || true
      - rm -f {{.SATELLITE_TOKEN_FILE}} 2>/dev/null || true
      - task: cleanup-harbor
        if: '[ -n "{{.HARBOR_EXTERNAL}}" ]'
      - echo "Crash recovery cleanup complete"
    silent: true

  register-and-run-satellite-byo-with-volume:
    desc: Register satellite with BYO registry and start with named volume
    cmds:
      - |
        GC_TOKEN=$(curl -sf -X POST {{.GROUNDCONTROL_URL}}/login \
          -H "Content-Type: application/json" \
          -d '{"username":"{{.GROUNDCONTROL_ADMIN_USER}}","password":"{{.GROUNDCONTROL_ADMIN_PASSWORD}}"}' | \
          grep -o '"token":"[^"]*"' | cut -d'"' -f4)
        if [ -z "$GC_TOKEN" ]; then
          echo "ERROR: Failed to get GC token"
          exit 1
        fi

        echo "Registering satellite..."
        RESPONSE=$(curl -sf -X POST {{.GROUNDCONTROL_URL}}/api/satellites \
          -H "Authorization: Bearer $GC_TOKEN" \
          -H "Content-Type: application/json" \
          -d '{
            "name": "{{.BYO_SATELLITE_NAME}}",
            "groups": ["{{.DEST_NAMESPACE}}"],
            "config_name": "{{.BYO_CONFIG_NAME}}"
          }')

        TOKEN=$(echo "$RESPONSE" | grep -o '"token":"[^"]*"' | cut -d'"' -f4)
        if [ -z "$TOKEN" ]; then
          echo "Failed to get satellite token"
          exit 1
        fi
        echo "Satellite registered with token: $TOKEN"
        echo "$TOKEN" > {{.BYO_SATELLITE_TOKEN_FILE}}

        echo "Starting BYO registry (registry:2)..."
        docker run -d --name {{.BYO_REGISTRY_CONTAINER}} --network {{.E2E_NETWORK}} \
          -e REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY=/var/lib/registry \
          -e REGISTRY_HTTP_ADDR=0.0.0.0:5000 \
          registry:2

        echo "Waiting for BYO registry to be healthy..."
        for i in $(seq 1 15); do
          if docker exec {{.BYO_REGISTRY_CONTAINER}} wget -q -O - http://localhost:5000/v2/ > /dev/null 2>&1; then
            echo "BYO registry is healthy"
            break
          fi
          if [ "$i" -eq 15 ]; then
            echo "ERROR: BYO registry failed to start"
            docker logs {{.BYO_REGISTRY_CONTAINER}} 2>&1 | tail -20
            exit 1
          fi
          echo "Waiting for BYO registry... ($i/15)"
          sleep 2
        done

        echo "Building satellite from local code..."
        docker build -t satellite:e2e -f Dockerfile .

        echo "Starting satellite in BYO mode with named volume..."
        docker run -d --name {{.SATELLITE_BYO_CONTAINER}} {{.SATELLITE_NETWORKS}} \
          -v {{.SAT_BYO_STATE_VOLUME}}:/data \
          -e TOKEN="$TOKEN" \
          -e GROUND_CONTROL_URL="{{.GC_INTERNAL_URL}}" \
          -e HARBOR_REGISTRY_URL="{{.HARBOR_INTERNAL_URL}}" \
          -e BYO_REGISTRY=true \
          -e REGISTRY_URL=http://{{.BYO_REGISTRY_CONTAINER}}:5000 \
          -e USE_UNSECURE=true \
          -e CONFIG_DIR=/data \
          satellite:e2e

  crash-and-restart-satellite-byo:
    desc: Kill BYO satellite and restart it to test crash recovery
    cmds:
      - |
        TOKEN=$(cat {{.BYO_SATELLITE_TOKEN_FILE}})

        echo "Killing BYO satellite (SIGKILL to simulate crash)..."
        docker kill {{.SATELLITE_BYO_CONTAINER}}
        docker rm {{.SATELLITE_BYO_CONTAINER}}

        echo "Restarting BYO satellite with same volume..."
        docker run -d --name {{.SATELLITE_BYO_CONTAINER}} {{.SATELLITE_NETWORKS}} \
          -v {{.SAT_BYO_STATE_VOLUME}}:/data \
          -e TOKEN="$TOKEN" \
          -e GROUND_CONTROL_URL="{{.GC_INTERNAL_URL}}" \
          -e HARBOR_REGISTRY_URL="{{.HARBOR_INTERNAL_URL}}" \
          -e BYO_REGISTRY=true \
          -e REGISTRY_URL=http://{{.BYO_REGISTRY_CONTAINER}}:5000 \
          -e USE_UNSECURE=true \
          -e CONFIG_DIR=/data \
          satellite:e2e

        echo "Waiting for satellite to start..."
        sleep 15

  verify-crash-recovery-byo:
    desc: Verify BYO satellite recovered from crash without full re-replication
    cmds:
      - |
        echo "Checking BYO satellite logs for crash recovery..."

        if docker logs {{.SATELLITE_BYO_CONTAINER}} 2>&1 | tail -100 | grep -q "Old state has zero entities, replicating the complete state"; then
          echo "FAIL: BYO satellite re-replicated the complete state after crash"
          docker logs {{.SATELLITE_BYO_CONTAINER}} 2>&1 | tail -50
          exit 1
        fi
        echo "PASS: No full re-replication detected"

        if docker logs {{.SATELLITE_BYO_CONTAINER}} 2>&1 | tail -100 | grep -q "Total artifacts to replicate: 0"; then
          echo "PASS: Zero artifacts to replicate after restart"
        else
          echo "WARN: Could not confirm zero artifacts to replicate (may still be syncing)"
        fi

        echo "Verifying image is still accessible in BYO registry..."
        for i in $(seq 1 6); do
          if docker run --rm --network {{.E2E_NETWORK}} alpine:latest sh -c "
            apk add --no-cache crane > /dev/null 2>&1 &&
            crane manifest {{.BYO_REGISTRY_CONTAINER}}:5000/{{.PROJECT_NAME}}/alpine:latest --insecure > /dev/null 2>&1
          "; then
            echo "PASS: Image still accessible in BYO registry after crash recovery"
            exit 0
          fi
          echo "Waiting for image availability... ($i/6)"
          sleep 5
        done
        echo "FAIL: Image not accessible in BYO registry after crash recovery"
        docker logs {{.SATELLITE_BYO_CONTAINER}} 2>&1 | tail -50
        exit 1

  cleanup-crash-recovery-byo:
    desc: Stop and remove BYO crash recovery E2E containers
    cmds:
      - echo "Stopping BYO crash recovery containers..."
      - docker rm -f {{.SATELLITE_BYO_CONTAINER}} {{.BYO_REGISTRY_CONTAINER}} 2>/dev/null || true
      - "{{.COMPOSE}} down -v --remove-orphans 2>/dev/null || true"
      - docker volume rm -f {{.SAT_BYO_STATE_VOLUME}} 2>/dev/null || true
      - rm -f {{.BYO_SATELLITE_TOKEN_FILE}} 2>/dev/null || true
      - task: cleanup-harbor
        if: '[ -n "{{.HARBOR_EXTERNAL}}" ]'
      - echo "BYO crash recovery cleanup complete"
    silent: true
