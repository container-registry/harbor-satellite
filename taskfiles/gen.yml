version: "3"

vars:
  OAPI_CODEGEN_CONFIG_DIR: "{{.ROOT_DIR}}/spec/groundcontrol/oapi-codegen"
  GROUNDCONTROL_OPENAPI_SPEC: "{{.ROOT_DIR}}/spec/groundcontrol/openapi.yaml"
  GROUNDCONTROL_SERVER_CONFIG: "{{.OAPI_CODEGEN_CONFIG_DIR}}/server.cfg.yaml"
  GROUNDCONTROL_SERVER_OUTPUT_DIR: "{{.ROOT_DIR}}/internal/groundcontrol/server"
  GROUNDCONTROL_SERVER_OUTPUT: "{{.GROUNDCONTROL_SERVER_OUTPUT_DIR}}/server.gen.go"
  GROUNDCONTROL_CLIENT_CONFIG: "{{.OAPI_CODEGEN_CONFIG_DIR}}/client.cfg.yaml"
  GROUNDCONTROL_CLIENT_OUTPUT_DIR: "{{.ROOT_DIR}}/pkg/groundcontrol"
  GROUNDCONTROL_CLIENT_OUTPUT: "{{.GROUNDCONTROL_CLIENT_OUTPUT_DIR}}/client.gen.go"

tasks:
  oapi-codegen:install:
    internal: true
    desc: Install oapi-codegen
    env:
      GOBIN: "{{.BIN_DIR}}"
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@{{.OAPI_CODEGEN_VERSION}}
    status:
      - test -x {{.BIN_DIR}}/oapi-codegen
      - "{{.BIN_DIR}}/oapi-codegen -version | grep -q '{{.OAPI_CODEGEN_RELEASE_VERSION}}'"

  groundcontrol:
    desc: Generate Ground Control OpenAPI server and client code
    cmds:
      - task: groundcontrol-server
      - task: groundcontrol-client

  groundcontrol-server:
    desc: Generate Ground Control OpenAPI server code
    cmds:
      - task: oapi-codegen:install
      - mkdir -p "{{.GROUNDCONTROL_SERVER_OUTPUT_DIR}}"
      - '"{{.BIN_DIR}}/oapi-codegen" -config "{{.GROUNDCONTROL_SERVER_CONFIG}}" -o "{{.GROUNDCONTROL_SERVER_OUTPUT}}" "{{.GROUNDCONTROL_OPENAPI_SPEC}}"'
    sources:
      - "{{.GROUNDCONTROL_OPENAPI_SPEC}}"
      - "{{.GROUNDCONTROL_SERVER_CONFIG}}"
    generates:
      - "{{.GROUNDCONTROL_SERVER_OUTPUT}}"

  groundcontrol-client:
    desc: Generate Ground Control OpenAPI client code
    cmds:
      - task: oapi-codegen:install
      - mkdir -p "{{.GROUNDCONTROL_CLIENT_OUTPUT_DIR}}"
      - '"{{.BIN_DIR}}/oapi-codegen" -config "{{.GROUNDCONTROL_CLIENT_CONFIG}}" -o "{{.GROUNDCONTROL_CLIENT_OUTPUT}}" "{{.GROUNDCONTROL_OPENAPI_SPEC}}"'
    sources:
      - "{{.GROUNDCONTROL_OPENAPI_SPEC}}"
      - "{{.GROUNDCONTROL_CLIENT_CONFIG}}"
    generates:
      - "{{.GROUNDCONTROL_CLIENT_OUTPUT}}"
