baseURL = "https://satellite.container-registry.com/"
locale = "en-us"
title = "Harbor Satellite"
disableKinds = ["taxonomy", "term"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = true
    style = "monokai"

[params]
  description = "Harbor Satellite brings your central Harbor registry to edge and air-gapped sites: desired-state replication, a local pull endpoint and fleet management from one control plane."
  githubRepo = "https://github.com/container-registry/harbor-satellite"
  contactURL = "https://container-registry.com/contact/"
