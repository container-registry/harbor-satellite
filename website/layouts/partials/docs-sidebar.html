{{ $current := . }}
{{ with .Site.GetPage "section" "docs" }}
<div class="docs-nav__section">
  <a href="{{ .RelPermalink }}" class="docs-nav__link docs-nav__link--section{{ if eq $current.RelPermalink .RelPermalink }} docs-nav__link--active{{ end }}">{{ .Title }}</a>
  <div class="docs-nav__children">
    {{ range .Pages.ByWeight }}
    <a href="{{ .RelPermalink }}" class="docs-nav__link{{ if eq $current.RelPermalink .RelPermalink }} docs-nav__link--active{{ end }}"{{ if eq $current.RelPermalink .RelPermalink }} aria-current="page"{{ end }}>{{ .Title }}</a>
    {{ end }}
  </div>
</div>
{{ end }}
